<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>STAR BRAWL ARENA</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

:root{
  --yellow:#ffd900;
  --blue:#27d8ff;
  --pink:#ff3978;
  --purple:#7545d8;
  --green:#45ed68;
  --dark:#101219;
}

body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#35415e,#11141d 60%,#08090d);
  color:white;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

button{
  font-family:inherit;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.game{
  width:min(1100px,97vw);
  height:min(760px,97vh);
  background:#171a24;
  border:5px solid var(--pink);
  border-radius:24px;
  box-shadow:
    0 0 35px #ff397855,
    inset 0 0 35px #0008;
  position:relative;
  overflow:hidden;
}

/* ======================================================
   HOME
====================================================== */

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}

#home{
  flex-direction:column;
  align-items:center;
  padding:15px;
  overflow-y:auto;
}

.logo{
  font-size:42px;
  font-weight:1000;
  color:var(--yellow);
  text-shadow:
    4px 4px 0 var(--pink),
    7px 7px 0 #000;
  margin:4px 0;
}

.subtitle{
  color:#9eefff;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.section-title{
  width:min(850px,95%);
  color:var(--blue);
  font-size:14px;
  font-weight:bold;
  margin:7px 0 5px;
}

.mode-grid{
  width:min(850px,95%);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.mode{
  padding:11px 5px;
  border-radius:13px;
  border:2px solid #4d5362;
  background:#292d3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.mode.selected{
  background:var(--blue);
  color:#071118;
  border-color:white;
  box-shadow:0 0 14px var(--blue);
}

.character-grid{
  width:min(850px,95%);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.character{
  min-height:200px;
  background:linear-gradient(#343a50,#1a1d27);
  border:3px solid #555b6b;
  border-radius:18px;
  padding:8px;
  cursor:pointer;
  transition:.15s;
}

.character:hover{
  transform:translateY(-3px);
}

.character.selected{
  border-color:var(--yellow);
  box-shadow:0 0 20px #ffd90088;
}

.portrait{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.char-name{
  font-size:19px;
  font-weight:1000;
}

.char-desc{
  font-size:10px;
  color:#cdd2dd;
  margin:3px 0 5px;
}

.stat{
  text-align:left;
  font-size:9px;
  margin-top:3px;
}

.statbar{
  height:6px;
  background:#101116;
  border-radius:4px;
  overflow:hidden;
  margin-top:2px;
}

.statfill{
  height:100%;
  background:var(--yellow);
}

.start{
  margin:14px 0 8px;
  padding:14px 60px;
  border:0;
  border-radius:40px;
  background:linear-gradient(#54ff7e,#16a849);
  color:#061108;
  font-size:22px;
  font-weight:1000;
  box-shadow:0 5px 0 #08742e;
  cursor:pointer;
}

.start:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #08742e;
}

/* ======================================================
   CHARACTER
====================================================== */

.unit{
  position:absolute;
  width:52px;
  height:62px;
  transform:translate(-50%,-50%);
  z-index:30;
  pointer-events:none;
}

.unit-shadow{
  position:absolute;
  width:44px;
  height:12px;
  bottom:-2px;
  left:4px;
  background:#0008;
  border-radius:50%;
}

.body{
  position:absolute;
  left:8px;
  top:18px;
  width:36px;
  height:37px;
  border:3px solid #181818;
  border-radius:13px 13px 10px 10px;
}

.head{
  position:absolute;
  left:9px;
  top:1px;
  width:34px;
  height:32px;
  border:3px solid #181818;
  border-radius:50%;
  background:#efbd82;
  z-index:3;
}

.eye{
  position:absolute;
  width:5px;
  height:7px;
  border-radius:50%;
  background:#151515;
  top:10px;
}

.eye.a{left:8px}
.eye.b{right:8px}

.hair{
  position:absolute;
  z-index:5;
  left:4px;
  top:-3px;
  width:44px;
  height:18px;
  border-radius:50% 50% 30% 30%;
}

/* HIMIKO */

.himiko .body{
  background:#a947dc;
}

.himiko .hair{
  background:#f1f1f1;
}

.himiko .head:after{
  content:"✦";
  position:absolute;
  color:#b83dff;
  right:-9px;
  top:-9px;
  font-size:14px;
}

/* NOBUNAGA */

.nobunaga .body{
  background:#315fd3;
}

.nobunaga .hair{
  background:#181818;
  height:23px;
  border-radius:50% 50% 10% 10%;
}

.nobunaga .body:after{
  content:"";
  position:absolute;
  left:13px;
  top:3px;
  width:5px;
  height:28px;
  background:#e8e8e8;
}

/* RYOMA */

.ryoma .body{
  background:#c7782b;
}

.ryoma .hair{
  background:#67361c;
}

.ryoma .body:after{
  content:"";
  position:absolute;
  left:6px;
  top:8px;
  width:24px;
  height:5px;
  background:#ffe0a1;
}

/* weapon */

.weapon{
  position:absolute;
  right:-19px;
  top:31px;
  width:28px;
  height:7px;
  background:#d3d8df;
  border:2px solid #222;
  transform:rotate(-15deg);
  z-index:6;
}

/* ======================================================
   BATTLE
====================================================== */

#battle{
  flex-direction:column;
  background:#090b10;
}

.hud{
  height:62px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 12px;
  background:linear-gradient(#222735,#11131a);
  border-bottom:3px solid #343948;
  z-index:100;
}

.hud-left{
  display:flex;
  align-items:center;
  gap:8px;
}

.score-box,
.timer-box{
  padding:6px 10px;
  border-radius:9px;
  background:#080a0f;
  border:2px solid #363b48;
  font-size:13px;
  font-weight:bold;
}

.score{
  color:var(--yellow);
}

.timer{
  color:var(--pink);
}

.combo{
  color:var(--blue);
  font-weight:1000;
}

.battle-area{
  flex:1;
  display:flex;
  gap:8px;
  padding:7px;
  min-height:0;
}

#field{
  flex:1;
  position:relative;
  overflow:hidden;
  border:4px solid var(--purple);
  border-radius:15px;
  background:#32843a;
  cursor:crosshair;
  touch-action:none;
}

/* ======================================================
   MAP
====================================================== */

.map-object{
  position:absolute;
  pointer-events:none;
}

.wall{
  background:
    linear-gradient(135deg,#796f61,#50483d);
  border:3px solid #2c2824;
  box-shadow:inset 0 0 0 2px #968a76;
  border-radius:5px;
}

.wall.breakable{
  background:
    linear-gradient(135deg,#9a663d,#674225);
}

.bush{
  background:
    radial-gradient(circle,#5ab54b 0 18%,transparent 19%),
    radial-gradient(circle,#2f8e3d 0 20%,transparent 21%);
  background-size:16px 16px;
  border-radius:12px;
}

.water{
  background:
    repeating-linear-gradient(
      0deg,
      #278fc2 0 8px,
      #43b5df 9px 11px,
      #278fc2 12px 17px
    );
  border:3px solid #196e99;
}

/* ======================================================
   CHESTS
====================================================== */

.chest{
  position:absolute;
  width:34px;
  height:28px;
  transform:translate(-50%,-50%);
  background:#a76527;
  border:3px solid #42230e;
  border-radius:5px;
  z-index:14;
  box-shadow:0 4px 0 #4c2912;
}

.chest:before{
  content:"";
  position:absolute;
  left:0;
  top:8px;
  width:100%;
  height:5px;
  background:#e2a238;
}

.chest:after{
  content:"";
  position:absolute;
  width:7px;
  height:8px;
  background:#ffe06b;
  border:2px solid #5a3a0c;
  left:11px;
  top:11px;
}

/* ======================================================
   POWER CUBE
====================================================== */

.power-cube{
  position:absolute;
  width:31px;
  height:31px;
  transform:translate(-50%,-50%);
  background:#62e34b;
  border:3px solid white;
  border-radius:7px;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:1000;
  font-size:17px;
  box-shadow:0 0 15px #62e34b;
  z-index:18;
}

/* ======================================================
   ENEMY
====================================================== */

.enemy .body{
  background:#d93651;
}

.enemy .head{
  background:#d7d7d7;
}

.enemy .hair{
  background:#292929;
}

.enemy .weapon{
  background:#ffd43d;
}

/* ======================================================
   PROJECTILES
====================================================== */

.projectile{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:50;
  pointer-events:none;
}

.magic{
  width:15px;
  height:15px;
  border-radius:50%;
  background:#d978ff;
  box-shadow:0 0 15px #e9a0ff;
}

.bullet{
  width:12px;
  height:7px;
  border-radius:4px;
  background:#6fd9ff;
  box-shadow:0 0 12px #58c7ff;
}

.bigbullet{
  width:23px;
  height:23px;
  border-radius:50%;
  background:#ff9c36;
  box-shadow:0 0 18px #ff8b22;
  border:3px solid #fff0b0;
}

/* ======================================================
   AIM
====================================================== */

#aimLine{
  position:absolute;
  height:3px;
  transform-origin:left center;
  background:#ffffff80;
  box-shadow:0 0 7px white;
  z-index:10;
  pointer-events:none;
}

#aimDot{
  position:absolute;
  width:12px;
  height:12px;
  transform:translate(-50%,-50%);
  border:2px solid white;
  border-radius:50%;
  z-index:11;
  pointer-events:none;
}

/* ======================================================
   SIDE
====================================================== */

.side{
  width:160px;
  background:#171a23;
  border:2px solid #303544;
  border-radius:12px;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.card{
  background:#232735;
  padding:6px;
  border-radius:8px;
}

.card-name{
  font-size:11px;
  font-weight:bold;
}

.hp{
  height:11px;
  margin-top:4px;
  background:#0e1015;
  border:1px solid #000;
  border-radius:5px;
  overflow:hidden;
}

.hp-fill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#25d56a,#8aff40);
  transition:.15s;
}

.info{
  padding:7px;
  background:#292e3c;
  border-radius:8px;
  text-align:center;
  font-size:10px;
}

.info strong{
  color:var(--yellow);
}

.ult{
  margin-top:auto;
  min-height:82px;
  border-radius:50%;
  border:4px solid #444;
  background:#303238;
  color:#777;
  font-weight:1000;
  cursor:not-allowed;
}

.ult.ready{
  background:radial-gradient(circle,#fff46a,#ffbc00);
  color:#211700;
  border-color:white;
  box-shadow:0 0 24px var(--yellow);
  cursor:pointer;
  animation:pulse 1s infinite;
}

.ult.targeting{
  background:#ff3978;
  color:white;
  border-color:white;
}

@keyframes pulse{
  50%{transform:scale(1.07)}
}

/* ======================================================
   CONTROLS
====================================================== */

.controls{
  position:absolute;
  inset:0;
  z-index:90;
  pointer-events:none;
}

.joystick{
  position:absolute;
  left:18px;
  bottom:18px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ffffff18;
  border:3px solid #ffffff35;
  pointer-events:auto;
  touch-action:none;
}

.stick{
  position:absolute;
  left:25px;
  top:25px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffffff45;
  border:2px solid #ffffff70;
}

.attack{
  position:absolute;
  right:25px;
  bottom:25px;
  width:78px;
  height:78px;
  border-radius:50%;
  border:4px solid white;
  background:#e43c58;
  color:white;
  font-weight:1000;
  pointer-events:auto;
  box-shadow:0 5px 0 #8e2134;
}

.attack:active{
  transform:scale(.92);
}

/* ======================================================
   EFFECTS
====================================================== */

.damage{
  position:absolute;
  z-index:100;
  font-size:19px;
  font-weight:1000;
  color:white;
  text-shadow:2px 2px #000;
  transform:translate(-50%,0);
  animation:damage .65s forwards;
  pointer-events:none;
}

@keyframes damage{
  to{
    transform:translate(-50%,-45px) scale(1.3);
    opacity:0;
  }
}

.ko{
  position:absolute;
  z-index:120;
  color:#ffd900;
  font-size:35px;
  font-weight:1000;
  text-shadow:
    4px 4px #ff3978,
    7px 7px #000;
  transform:translate(-50%,-50%);
  animation:ko .8s forwards;
  pointer-events:none;
}

@keyframes ko{
  0%{
    transform:translate(-50%,-50%) scale(.2) rotate(-15deg);
    opacity:0;
  }
  30%{
    transform:translate(-50%,-50%) scale(1.5) rotate(5deg);
    opacity:1;
  }
  100%{
    transform:translate(-50%,-90%) scale(1);
    opacity:0;
  }
}

.explosion{
  position:absolute;
  width:180px;
  height:180px;
  border:12px solid #ffd900;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.1);
  z-index:100;
  pointer-events:none;
  animation:explode .55s forwards;
}

@keyframes explode{
  to{
    transform:translate(-50%,-50%) scale(2);
    opacity:0;
  }
}

/* ======================================================
   COUNTDOWN
====================================================== */

#countdown{
  position:absolute;
  inset:0;
  z-index:300;
  display:none;
  justify-content:center;
  align-items:center;
  background:#0008;
}

.count{
  font-size:100px;
  font-weight:1000;
  color:#ffd900;
  text-shadow:
    8px 8px #ff3978,
    12px 12px #000;
  animation:count .75s ease-out;
}

@keyframes count{
  from{
    transform:scale(2);
    opacity:0;
  }
  60%{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(.8);
    opacity:0;
  }
}

/* ======================================================
   RESULT
====================================================== */

#result{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle,#3b4774,#10131c 70%);
}

.result-title{
  font-size:48px;
  color:#ffd900;
  text-shadow:
    5px 5px #ff3978,
    8px 8px #000;
}

.final{
  font-size:58px;
  font-weight:1000;
}

.comment{
  color:#6fe4ff;
  font-weight:bold;
  margin:10px;
}

.home-btn{
  padding:13px 50px;
  border:0;
  border-radius:30px;
  background:#7545d8;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* ======================================================
   MOBILE
====================================================== */

@media(max-width:700px){

  .game{
    width:100vw;
    height:100vh;
    border-radius:0;
    border-width:3px;
  }

  .logo{
    font-size:28px;
  }

  .mode-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .character-grid{
    gap:6px;
  }

  .character{
    min-height:160px;
  }

  .char-desc{
    display:none;
  }

  .side{
    width:105px;
  }

  .joystick{
    width:90px;
    height:90px;
  }

  .stick{
    left:20px;
    top:20px;
  }

}
</style>
</head>

<body>

<div id="app">

<div class="game">

<!-- =====================================================
HOME
===================================================== -->

<section id="home" class="screen active">

  <div class="logo">
    STAR BRAWL ARENA
  </div>

  <div class="subtitle">
    狙いを定めて、最後まで戦い抜け！
  </div>

  <div class="section-title">

  </div>

  <div class="mode-grid">

    <button class="mode selected" data-mode="solo">
      ⚔️ ソロ
    </button>

    <button class="mode" data-mode="duo">
      👥 デュオ
    </button>

    <button class="mode" data-mode="trio">
      👥👥 トリオ
    </button>

  </div>

  <div class="section-title">
    ▼ キャラクター
  </div>

  <div class="character-grid">

    <!-- HIMIKO -->

    <div class="character selected" data-char="himiko">

      <div class="portrait">

        <div class="unit himiko"
             style="position:relative;transform:none">

          <div class="unit-shadow"></div>
          <div class="hair"></div>

          <div class="head">
            <i class="eye a"></i>
            <i class="eye b"></i>
          </div>

          <div class="body"></div>
          <div class="weapon"></div>

        </div>

      </div>

      <div class="char-name">
        HIMIKO
      </div>

      <div class="char-desc">
        🔮 3方向魔法弾・範囲攻撃
      </div>

      <div class="stat">
        攻撃
        <div class="statbar">
          <div class="statfill" style="width:80%"></div>
        </div>
      </div>

      <div class="stat">
        HP
        <div class="statbar">
          <div class="statfill" style="width:65%"></div>
        </div>
      </div>

      <div class="stat">
        SPEED
        <div class="statbar">
          <div class="statfill" style="width:85%"></div>
        </div>
      </div>

    </div>


    <!-- NOBUNAGA -->

    <div class="character" data-char="nobunaga">

      <div class="portrait">

        <div class="unit nobunaga"
             style="position:relative;transform:none">

          <div class="unit-shadow"></div>
          <div class="hair"></div>

          <div class="head">
            <i class="eye a"></i>
            <i class="eye b"></i>
          </div>

          <div class="body"></div>
          <div class="weapon"></div>

        </div>

      </div>

      <div class="char-name">
        NOBUNAGA
      </div>

      <div class="char-desc">
        ⚔️ 高速3連射・斬撃SUPER
      </div>

      <div class="stat">
        攻撃
        <div class="statbar">
          <div class="statfill" style="width:75%"></div>
        </div>
      </div>

      <div class="stat">
        HP
        <div class="statbar">
          <div class="statfill" style="width:85%"></div>
        </div>
      </div>

      <div class="stat">
        SPEED
        <div class="statbar">
          <div class="statfill" style="width:100%"></div>
        </div>
      </div>

    </div>


    <!-- RYOMA -->

    <div class="character" data-char="ryoma">

      <div class="portrait">

        <div class="unit ryoma"
             style="position:relative;transform:none">

          <div class="unit-shadow"></div>
          <div class="hair"></div>

          <div class="head">
            <i class="eye a"></i>
            <i class="eye b"></i>
          </div>

          <div class="body"></div>
          <div class="weapon"></div>

        </div>

      </div>

      <div class="char-name">
        RYOMA
      </div>

      <div class="char-desc">
        💥 巨大弾・超高火力
      </div>

      <div class="stat">
        攻撃
        <div class="statbar">
          <div class="statfill" style="width:100%"></div>
        </div>
      </div>

      <div class="stat">
        HP
        <div class="statbar">
          <div class="statfill" style="width:100%"></div>
        </div>
      </div>

      <div class="stat">
        SPEED
        <div class="statbar">
          <div class="statfill" style="width:55%"></div>
        </div>
      </div>

    </div>

  </div>

  <button class="start" id="start">
    BATTLE START!
  </button>

</section>


<!-- =====================================================
BATTLE
===================================================== -->

<section id="battle" class="screen">

  <div class="hud">

    <div class="hud-left">

      <div class="score-box">
        SCORE:
        <span class="score" id="score">0</span>
      </div>

      <div class="combo" id="combo">
        COMBO ×0
      </div>

    </div>

    <div class="timer-box">
      TIME:
      <span class="timer" id="timer">60</span>
    </div>

  </div>


  <div class="battle-area">

    <div id="field">

      <div id="aimLine"></div>
      <div id="aimDot"></div>

    </div>


    <div class="side">

      <div class="card">

        <div class="card-name" id="playerName">
          HIMIKO
        </div>

        <div class="hp">
          <div class="hp-fill" id="playerHp"></div>
        </div>

      </div>


      <div class="card" id="ally1Card" style="display:none">

        <div class="card-name">
          ALLY 1
        </div>

        <div class="hp">
          <div class="hp-fill" id="ally1Hp"></div>
        </div>

      </div>


      <div class="card" id="ally2Card" style="display:none">

        <div class="card-name">
          ALLY 2
        </div>

        <div class="hp">
          <div class="hp-fill" id="ally2Hp"></div>
        </div>

      </div>


      <div class="info">
        SUPER
        <strong id="superPercent">0%</strong>
      </div>


      <div class="info">
        POWER
        <strong id="powerLevel">0</strong>
      </div>


      <button class="ult" id="ult">
        SUPER
      </button>

    </div>

  </div>


  <div class="controls">

    <div class="joystick" id="joystick">
      <div class="stick" id="stick"></div>
    </div>

    <button class="attack" id="attack">
      ATTACK
    </button>

  </div>


  <div id="countdown">
    <div class="count" id="count">
      3
    </div>
  </div>

</section>


<!-- =====================================================
RESULT
===================================================== -->

<section id="result" class="screen">

  <div class="result-title">
    BATTLE OVER
  </div>

  <div class="final">
    <span id="finalScore">0</span>
  </div>

  <div class="comment" id="comment">
    GREAT BATTLE!
  </div>

  <button class="home-btn" id="homeButton">
    HOME
  </button>

</section>

</div>
</div>


<script>

/* =========================================================
CHARACTER DATA
========================================================= */

const CHARACTERS={

  himiko:{
    name:"HIMIKO",
    className:"himiko",

    maxHp:1200,
    speed:3.1,

    damage:125,
    projectileSpeed:9,
    range:600,

    attackType:"magic",

    superDamage:450
  },

  nobunaga:{
    name:"NOBUNAGA",
    className:"nobunaga",

    maxHp:1500,
    speed:3.6,

    damage:85,
    projectileSpeed:12,
    range:650,

    attackType:"triple",

    superDamage:300
  },

  ryoma:{
    name:"RYOMA",
    className:"ryoma",

    maxHp:1900,
    speed:2.6,

    damage:300,
    projectileSpeed:6,
    range:550,

    attackType:"big",

    superDamage:700
  }

};


/* =========================================================
STATE
========================================================= */

let selectedCharacter="himiko";
let selectedMode="solo";

let score=0;
let combo=0;
let timeLeft=60;

let superCharge=0;
let powerLevel=0;

let gameRunning=false;
let superTargeting=false;

let player=null;

let enemies=[];
let projectiles=[];
let items=[];
let chests=[];
let walls=[];

let timerInterval=null;
let enemyInterval=null;
let itemInterval=null;
let gameLoopId=null;

let keys={};

let aimX=1;
let aimY=0;

let joystickX=0;
let joystickY=0;


/* =========================================================
DOM
========================================================= */

const home=document.getElementById("home");
const battle=document.getElementById("battle");
const result=document.getElementById("result");

const field=document.getElementById("field");

const scoreEl=document.getElementById("score");
const comboEl=document.getElementById("combo");
const timerEl=document.getElementById("timer");

const playerHpEl=document.getElementById("playerHp");
const playerNameEl=document.getElementById("playerName");

const superEl=document.getElementById("superPercent");
const powerEl=document.getElementById("powerLevel");

const ult=document.getElementById("ult");

const aimLine=document.getElementById("aimLine");
const aimDot=document.getElementById("aimDot");


/* =========================================================
MENU
========================================================= */

document.querySelectorAll(".mode").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".mode")
      .forEach(b=>b.classList.remove("selected"));

    btn.classList.add("selected");

    selectedMode=btn.dataset.mode;

  });

});


document.querySelectorAll(".character").forEach(card=>{

  card.addEventListener("click",()=>{

    document.querySelectorAll(".character")
      .forEach(c=>c.classList.remove("selected"));

    card.classList.add("selected");

    selectedCharacter=card.dataset.char;

  });

});


/* =========================================================
START GAME
========================================================= */

document.getElementById("start").addEventListener(
  "click",
  startGame
);


function startGame(){

  home.classList.remove("active");
  battle.classList.add("active");

  const c=CHARACTERS[selectedCharacter];

  player={
    x:120,
    y:200,

    hp:c.maxHp,
    maxHp:c.maxHp,

    speed:c.speed,
    damage:c.damage,

    attackCooldown:0
  };

  score=0;
  combo=0;
  timeLeft=60;

  superCharge=0;
  powerLevel=0;

  enemies=[];
  projectiles=[];
  items=[];
  chests=[];
  walls=[];

  field.innerHTML=`
    <div id="aimLine"></div>
    <div id="aimDot"></div>
  `;

  playerNameEl.textContent=c.name;

  createMap();
  createPlayer();

  if(selectedMode==="duo" || selectedMode==="trio"){
    document.getElementById("ally1Card")
      .style.display="block";
  }else{
    document.getElementById("ally1Card")
      .style.display="none";
  }

  if(selectedMode==="trio"){
    document.getElementById("ally2Card")
      .style.display="block";
  }else{
    document.getElementById("ally2Card")
      .style.display="none";
  }

  updateUI();

  startCountdown();

}


/* =========================================================
COUNTDOWN
========================================================= */

function startCountdown(){

  const box=document.getElementById("countdown");
  const text=document.getElementById("count");

  box.style.display="flex";

  let n=3;

  function tick(){

    if(n>0){

      text.textContent=n;

    }else{

      text.textContent="BRAWL!";

    }

    text.style.animation="none";
    void text.offsetWidth;
    text.style.animation="count .75s ease-out";

    if(n===0){

      setTimeout(()=>{

        box.style.display="none";
        beginBattle();

      },700);

      return;
    }

    n--;

    setTimeout(tick,750);

  }

  tick();

}


/* =========================================================
MAP
========================================================= */

function createMap(){

  const w=field.clientWidth;
  const h=field.clientHeight;

  createObject(
    "water",
    0,
    h-65,
    w,
    65
  );


  /* central walls */

  createWall(
    w/2-100,
    h/2-20,
    200,
    40,
    false
  );


  createWall(
    190,
    70,
    130,
    35,
    true
  );

  createWall(
    190,
    105,
    35,
    125,
    true
  );


  createWall(
    w-320,
    70,
    130,
    35,
    true
  );

  createWall(
    w-225,
    105,
    35,
    125,
    true
  );


  createWall(
    170,
    h-180,
    130,
    35,
    false
  );

  createWall(
    w-300,
    h-180,
    130,
    35,
    false
  );


  /* bushes */

  createObject(
    "bush",
    25,
    40,
    125,
    85
  );

  createObject(
    "bush",
    w-150,
    40,
    125,
    85
  );

  createObject(
    "bush",
    w/2-65,
    h-155,
    130,
    70
  );


  /* chests */

  createChest(
    w/2-180,
    h/2
  );

  createChest(
    w/2+180,
    h/2
  );

}


function createObject(type,x,y,w,h){

  const el=document.createElement("div");

  el.className="map-object "+type;

  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.width=w+"px";
  el.style.height=h+"px";

  field.appendChild(el);

}


function createWall(x,y,w,h,breakable){

  const el=document.createElement("div");

  el.className=
    "map-object wall"+
    (breakable?" breakable":"");

  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.width=w+"px";
  el.style.height=h+"px";

  field.appendChild(el);

  walls.push({
    x,y,w,h,
    breakable,
    el,
    hp:breakable?500:Infinity
  });

}


function createChest(x,y){

  const el=document.createElement("div");

  el.className="chest";

  el.style.left=x+"px";
  el.style.top=y+"px";

  field.appendChild(el);

  chests.push({
    x,y,
    hp:300,
    el
  });

}


/* =========================================================
PLAYER
========================================================= */

function createPlayer(){

  const c=CHARACTERS[selectedCharacter];

  const el=document.createElement("div");

  el.id="playerUnit";

  el.className=
    "unit "+c.className;

  el.innerHTML=`
    <div class="unit-shadow"></div>
    <div class="hair"></div>

    <div class="head">
      <i class="eye a"></i>
      <i class="eye b"></i>
    </div>

    <div class="body"></div>
    <div class="weapon"></div>
  `;

  field.appendChild(el);

  updatePlayerPosition();

}


function updatePlayerPosition(){

  const el=document.getElementById("playerUnit");

  if(!el)return;

  el.style.left=player.x+"px";
  el.style.top=player.y+"px";

}


/* =========================================================
MOVEMENT
========================================================= */

document.addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.code==="Space"){

    e.preventDefault();

    if(gameRunning){
      fireAttack();
    }

  }

});


document.addEventListener("keyup",e=>{

  keys[e.key.toLowerCase()]=false;

});


function movePlayer(){

  if(!gameRunning)return;

  let dx=0;
  let dy=0;

  if(keys["w"] || keys["arrowup"])dy--;
  if(keys["s"] || keys["arrowdown"])dy++;
  if(keys["a"] || keys["arrowleft"])dx--;
  if(keys["d"] || keys["arrowright"])dx++;

  dx+=joystickX;
  dy+=joystickY;

  const length=Math.hypot(dx,dy);

  if(length>0){

    dx/=length;
    dy/=length;

    const nx=
      player.x+
      dx*player.speed;

    const ny=
      player.y+
      dy*player.speed;

    if(
      nx>25 &&
      nx<field.clientWidth-25 &&
      ny>30 &&
      ny<field.clientHeight-75 &&
      !collides(nx,ny)
    ){

      player.x=nx;
      player.y=ny;

    }

  }

  updatePlayerPosition();

}


/* =========================================================
COLLISION
========================================================= */

function collides(x,y){

  const r=22;

  return walls.some(w=>{

    return(
      x+r>w.x &&
      x-r<w.x+w.w &&
      y+r>w.y &&
      y-r<w.y+w.h
    );

  });

}


/* =========================================================
AIM
========================================================= */

function updateAim(clientX,clientY){

  if(!gameRunning)return;

  const rect=field.getBoundingClientRect();

  const x=
    clientX-rect.left;

  const y=
    clientY-rect.top;

  let dx=x-player.x;
  let dy=y-player.y;

  const len=Math.hypot(dx,dy);

  if(len<5)return;

  aimX=dx/len;
  aimY=dy/len;

  drawAim();

}


function drawAim(){

  if(!player)return;

  const length=100;

  const x2=
    player.x+
    aimX*length;

  const y2=
    player.y+
    aimY*length;

  const angle=
    Math.atan2(
      aimY,
      aimX
    )*
    180/Math.PI;

  aimLine.style.left=
    player.x+"px";

  aimLine.style.top=
    player.y+"px";

  aimLine.style.width=
    length+"px";

  aimLine.style.transform=
    `rotate(${angle}deg)`;

  aimDot.style.left=
    x2+"px";

  aimDot.style.top=
    y2+"px";

}


/* マウス */

field.addEventListener("pointermove",e=>{

  updateAim(
    e.clientX,
    e.clientY
  );

});


/* タッチ */

field.addEventListener("pointerdown",e=>{

  updateAim(
    e.clientX,
    e.clientY
  );

});


/* =========================================================
ATTACK BUTTON
========================================================= */

document.getElementById("attack")
  .addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      if(!gameRunning)return;

      if(superTargeting){

        fireSuper();

      }else{

        fireAttack();

      }

    }
  );


/* =========================================================
NORMAL ATTACK
========================================================= */

function fireAttack(){

  if(player.attackCooldown>0)return;

  const c=CHARACTERS[selectedCharacter];

  player.attackCooldown=
    c.attackType==="triple"
      ?12
      :c.attackType==="big"
        ?35
        :20;


  if(c.attackType==="magic"){

    /* 3方向魔法 */

    [-0.16,0,0.16].forEach(offset=>{

      const angle=
        Math.atan2(
          aimY,
          aimX
        )+offset;

      createProjectile(
        Math.cos(angle),
        Math.sin(angle),
        c.damage,
        c.projectileSpeed,
        "magic"
      );

    });

  }


  else if(c.attackType==="triple"){

    /* 高速3連射 */

    [-0.08,0,0.08].forEach(offset=>{

      const angle=
        Math.atan2(
          aimY,
          aimX
        )+offset;

      createProjectile(
        Math.cos(angle),
        Math.sin(angle),
        c.damage,
        c.projectileSpeed,
        "bullet"
      );

    });

  }


  else if(c.attackType==="big"){

    /* 巨大弾 */

    createProjectile(
      aimX,
      aimY,
      c.damage,
      c.projectileSpeed,
      "bigbullet"
    );

  }

}


/* =========================================================
PROJECTILE
========================================================= */

function createProjectile(
  dx,
  dy,
  damage,
  speed,
  type
){

  const el=document.createElement("div");

  el.className=
    "projectile "+type;

  el.style.left=
    player.x+"px";

  el.style.top=
    player.y+"px";

  field.appendChild(el);

  projectiles.push({

    el,

    x:player.x,
    y:player.y,

    dx,
    dy,

    damage:
      damage*
      (1+powerLevel*.15),

    speed,

    enemy:false,

    life:100

  });

}


/* =========================================================
SUPER
========================================================= */

ult.addEventListener("click",()=>{

  if(superCharge<100)return;

  if(!superTargeting){

    superTargeting=true;

    ult.classList.add("targeting");

    ult.textContent=
      "SELECT";

  }else{

    fireSuper();

  }

});


function fireSuper(){

  if(superCharge<100)return;

  superCharge=0;

  superTargeting=false;

  ult.classList.remove("targeting");

  const c=CHARACTERS[selectedCharacter];

  /* HIMIKO */

  if(selectedCharacter==="himiko"){

    createExplosion(
      player.x+
      aimX*130,

      player.y+
      aimY*130
    );

    enemies.forEach(enemy=>{

      const tx=
        player.x+
        aimX*130;

      const ty=
        player.y+
        aimY*130;

      if(
        Math.hypot(
          enemy.x-tx,
          enemy.y-ty
        )<150
      ){

        damageEnemy(
          enemy,
          c.superDamage
        );

      }

    });

  }


  /* NOBUNAGA */

  else if(selectedCharacter==="nobunaga"){

    /* 前方に巨大斬撃 */

    enemies.forEach(enemy=>{

      const vx=
        enemy.x-player.x;

      const vy=
        enemy.y-player.y;

      const distance=
        Math.hypot(vx,vy);

      if(distance>170)return;

      const dot=
        (vx*aimX+
         vy*aimY)/
        distance;

      if(dot>.35){

        damageEnemy(
          enemy,
          c.superDamage
        );

      }

    });

    createExplosion(
      player.x+
      aimX*100,

      player.y+
      aimY*100
    );

  }


  /* RYOMA */

  else if(selectedCharacter==="ryoma"){

    /* 巨大な貫通爆発 */

    for(let i=0;i<3;i++){

      setTimeout(()=>{

        createExplosion(
          player.x+
          aimX*(120+i*90),

          player.y+
          aimY*(120+i*90)
        );

      },i*120);

    }

    enemies.forEach(enemy=>{

      const vx=
        enemy.x-player.x;

      const vy=
        enemy.y-player.y;

      const distance=
        Math.hypot(vx,vy);

      if(distance>400)return;

      const dot=
        (vx*aimX+
         vy*aimY)/
        distance;

      if(dot>.65){

        damageEnemy(
          enemy,
          c.superDamage
        );

      }

    });

  }

  updateUI();

}


function createExplosion(x,y){

  const el=document.createElement("div");

  el.className="explosion";

  el.style.left=x+"px";
  el.style.top=y+"px";

  field.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    600
  );

}


/* =========================================================
ENEMY SPAWN
========================================================= */

function spawnEnemy(){

  if(!gameRunning)return;

  const w=field.clientWidth;
  const h=field.clientHeight;

  let x,y;

  for(let i=0;i<30;i++){

    x=
      40+
      Math.random()*
      (w-80);

    y=
      40+
      Math.random()*
      (h-130);

    if(
      Math.hypot(
        x-player.x,
        y-player.y
      )>180 &&
      !collides(x,y)
    ){

      break;

    }

  }


  const el=document.createElement("div");

  el.className="unit enemy";

  el.innerHTML=`
    <div class="unit-shadow"></div>
    <div class="hair"></div>

    <div class="head">
      <i class="eye a"></i>
      <i class="eye b"></i>
    </div>

    <div class="body"></div>
    <div class="weapon"></div>
  `;

  field.appendChild(el);


  const enemy={

    x,
    y,

    hp:
      650+
      powerLevel*100,

    maxHp:
      650+
      powerLevel*100,

    speed:
      .65+
      Math.random()*.4,

    cooldown:50,

    el

  };

  enemies.push(enemy);

}


/* =========================================================
ENEMY AI
========================================================= */

function updateEnemies(){

  enemies.forEach(enemy=>{

    let dx=
      player.x-
      enemy.x;

    let dy=
      player.y-
      enemy.y;

    const distance=
      Math.hypot(dx,dy);

    if(distance>60){

      dx/=distance;
      dy/=distance;

      const nx=
        enemy.x+
        dx*enemy.speed;

      const ny=
        enemy.y+
        dy*enemy.speed;

      if(!collides(nx,ny)){

        enemy.x=nx;
        enemy.y=ny;

      }

    }


    enemy.el.style.left=
      enemy.x+"px";

    enemy.el.style.top=
      enemy.y+"px";


    if(enemy.cooldown>0){

      enemy.cooldown--;

    }else if(distance<280){

      enemyAttack(enemy);

      enemy.cooldown=100;

    }

  });

}


/* =========================================================
ENEMY ATTACK
========================================================= */

function enemyAttack(enemy){

  const el=document.createElement("div");

  el.className=
    "projectile bullet";

  el.style.background=
    "#ff3978";

  el.style.boxShadow=
    "0 0 13px #ff3978";

  el.style.left=
    enemy.x+"px";

  el.style.top=
    enemy.y+"px";

  field.appendChild(el);


  const dx=
    player.x-
    enemy.x;

  const dy=
    player.y-
    enemy.y;

  const len=
    Math.hypot(dx,dy);


  projectiles.push({

    el,

    x:enemy.x,
    y:enemy.y,

    dx:dx/len,
    dy:dy/len,

    speed:5,

    damage:60,

    enemy:true,

    life:120

  });

}


/* =========================================================
PROJECTILE UPDATE
========================================================= */

function updateProjectiles(){

  for(
    let i=projectiles.length-1;
    i>=0;
    i--
  ){

    const p=projectiles[i];

    p.x+=
      p.dx*p.speed;

    p.y+=
      p.dy*p.speed;

    p.life--;


    p.el.style.left=
      p.x+"px";

    p.el.style.top=
      p.y+"px";


    if(
      p.life<=0 ||
      p.x<0 ||
      p.y<0 ||
      p.x>field.clientWidth ||
      p.y>field.clientHeight
    ){

      removeProjectile(i);

      continue;

    }


    /* enemy bullet */

    if(p.enemy){

      if(
        Math.hypot(
          p.x-player.x,
          p.y-player.y
        )<25
      ){

        player.hp-=p.damage;

        showDamage(
          player.x,
          player.y,
          p.damage
        );

        removeProjectile(i);

        if(player.hp<=0){

          /* ゲームオーバーではなく復活 */

          player.hp=
            player.maxHp*.35;

          combo=0;

          showMessage(
            "REVIVE!"
          );

        }

        continue;

      }

    }


    /* player projectile */

    else{

      let hit=false;


      /* enemy */

      for(
        let j=enemies.length-1;
        j>=0;
        j--
      ){

        const enemy=
          enemies[j];

        if(
          Math.hypot(
            p.x-enemy.x,
            p.y-enemy.y
          )<32
        ){

          damageEnemy(
            enemy,
            p.damage
          );

          hit=true;

          /* RYOMAは貫通 */

          if(
            selectedCharacter!=="ryoma"
          ){
            break;
          }

        }

      }


      /* breakable walls */

      for(
        let j=walls.length-1;
        j>=0;
        j--
      ){

        const wall=walls[j];

        if(!wall.breakable)continue;

        if(
          p.x>wall.x &&
          p.x<wall.x+wall.w &&
          p.y>wall.y &&
          p.y<wall.y+wall.h
        ){

          wall.hp-=p.damage;

          if(wall.hp<=0){

            wall.el.remove();
            walls.splice(j,1);

          }

          hit=true;

          break;

        }

      }


      /* chests */

      for(
        let j=chests.length-1;
        j>=0;
        j--
      ){

        const chest=chests[j];

        if(
          Math.hypot(
            p.x-chest.x,
            p.y-chest.y
          )<30
        ){

          chest.hp-=p.damage;

          if(chest.hp<=0){

            chest.el.remove();

            spawnPowerCube(
              chest.x,
              chest.y
            );

            chests.splice(j,1);

          }

          hit=true;

          break;

        }

      }


      if(
        hit &&
        selectedCharacter!=="ryoma"
      ){

        removeProjectile(i);

      }

    }

  }

}


function removeProjectile(index){

  if(!projectiles[index])return;

  projectiles[index].el.remove();

  projectiles.splice(
    index,
    1
  );

}


/* =========================================================
DAMAGE
========================================================= */

function damageEnemy(enemy,damage){

  if(!enemies.includes(enemy))return;

  enemy.hp-=damage;

  showDamage(
    enemy.x,
    enemy.y,
    damage
  );


  superCharge=
    Math.min(
      100,
      superCharge+
      Math.max(
        4,
        damage/35
      )
    );


  if(enemy.hp<=0){

    koEnemy(enemy);

  }

}


function koEnemy(enemy){

  const index=
    enemies.indexOf(enemy);

  if(index===-1)return;

  enemies.splice(
    index,
    1
  );

  enemy.el.remove();

  score+=100;

  combo++;

  superCharge=
    Math.min(
      100,
      superCharge+15
    );


  showKO(
    enemy.x,
    enemy.y
  );


  /* 敵撃破でパワーキューブ */

  if(Math.random()<.5){

    spawnPowerCube(
      enemy.x,
      enemy.y
    );

  }

}


/* =========================================================
POWER CUBE
========================================================= */

function spawnPowerCube(x,y){

  const el=
    document.createElement("div");

  el.className=
    "power-cube";

  el.textContent="⚡";

  el.style.left=
    x+"px";

  el.style.top=
    y+"px";

  field.appendChild(el);


  items.push({

    x,
    y,
    el

  });

}


function updateItems(){

  for(
    let i=items.length-1;
    i>=0;
    i--
  ){

    const item=
      items[i];

    if(
      Math.hypot(
        item.x-player.x,
        item.y-player.y
      )<35
    ){

      powerLevel++;

      player.hp=
        Math.min(
          player.maxHp,
          player.hp+220
        );

      score+=50;

      item.el.remove();

      items.splice(
        i,
        1
      );

      showMessage(
        "POWER UP!"
      );

    }

  }

}


/* =========================================================
EFFECTS
========================================================= */

function showDamage(x,y,value){

  const el=
    document.createElement("div");

  el.className="damage";

  el.textContent=
    "-"+
    Math.round(value);

  el.style.left=
    x+"px";

  el.style.top=
    y+"px";

  field.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    650
  );

}


function showKO(x,y){

  const el=
    document.createElement("div");

  el.className="ko";

  el.textContent="K.O.!";

  el.style.left=
    x+"px";

  el.style.top=
    y+"px";

  field.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    800
  );

}


function showMessage(text){

  const el=
    document.createElement("div");

  el.className="ko";

  el.textContent=text;

  el.style.left=
    "50%";

  el.style.top=
    "40%";

  field.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    800
  );

}


/* =========================================================
JOYSTICK
========================================================= */

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");


function updateJoystick(x,y){

  const rect=
    joystick.getBoundingClientRect();

  let dx=
    x-
    (rect.left+
     rect.width/2);

  let dy=
    y-
    (rect.top+
     rect.height/2);

  const max=32;

  const distance=
    Math.hypot(dx,dy);

  if(distance>max){

    dx=
      dx/distance*
      max;

    dy=
      dy/distance*
      max;

  }

  joystickX=
    dx/max;

  joystickY=
    dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

}


function resetJoystick(){

  joystickX=0;
  joystickY=0;

  stick.style.transform=
    "translate(0,0)";

}


joystick.addEventListener(
  "pointerdown",
  e=>{
    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );
  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.buttons ||
      e.pressure
    ){

      updateJoystick(
        e.clientX,
        e.clientY
      );

    }

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
PLAYER COOLDOWN
========================================================= */

function updateCooldown(){

  if(player.attackCooldown>0){

    player.attackCooldown--;

  }

}


/* =========================================================
UI
========================================================= */

function updateUI(){

  scoreEl.textContent=
    score;

  comboEl.textContent=
    "COMBO ×"+combo;

  timerEl.textContent=
    timeLeft;

  playerHpEl.style.width=
    Math.max(
      0,
      player.hp/
      player.maxHp*
      100
    )+"%";

  superEl.textContent=
    Math.round(superCharge)+
    "%";

  powerEl.textContent=
    powerLevel;


  if(superCharge>=100){

    ult.classList.add("ready");

    if(!superTargeting){

      ult.textContent=
        "SUPER READY";

    }

  }else{

    ult.classList.remove("ready");

    ult.textContent=
      "SUPER";

  }


  if(superTargeting){

    ult.classList.add("targeting");

    ult.textContent=
      "SELECT";

  }else{

    ult.classList.remove("targeting");

  }

}


/* =========================================================
GAME LOOP
========================================================= */

function gameLoop(){

  if(!gameRunning)return;

  movePlayer();

  updateCooldown();

  updateEnemies();

  updateProjectiles();

  updateItems();

  drawAim();

  updateUI();

  gameLoopId=
    requestAnimationFrame(
      gameLoop
    );

}


/* =========================================================
BEGIN
========================================================= */

function beginBattle(){

  gameRunning=true;

  spawnEnemy();
  spawnEnemy();

  timerInterval=
    setInterval(()=>{

      if(!gameRunning)return;

      timeLeft--;

      if(timeLeft<=0){

        endGame();

      }

    },1000);


  enemyInterval=
    setInterval(()=>{

      if(gameRunning){

        spawnEnemy();

      }

    },1800);


  itemInterval=
    setInterval(()=>{

      if(gameRunning){

        spawnPowerCube(
          50+
          Math.random()*
          (field.clientWidth-100),

          50+
          Math.random()*
          (field.clientHeight-150)
        );

      }

    },7000);


  gameLoop();

}


/* =========================================================
END
========================================================= */

function endGame(){

  if(!gameRunning)return;

  gameRunning=false;

  clearInterval(timerInterval);
  clearInterval(enemyInterval);
  clearInterval(itemInterval);

  cancelAnimationFrame(
    gameLoopId
  );


  document.getElementById(
    "finalScore"
  ).textContent=
    score;


  let comment;

  if(score>=1500){

    comment=
      "🏆 LEGENDARY BRAWLER!";

  }else if(score>=800){

    comment=
      "🔥 AMAZING BATTLE!";

  }else if(score>=300){

    comment=
      "👍 NICE FIGHT!";

  }else{

    comment=
      "💪 KEEP BRAWLING!";

  }


  document.getElementById(
    "comment"
  ).textContent=
    comment;


  battle.classList.remove(
    "active"
  );

  result.classList.add(
    "active"
  );

}


document.getElementById(
  "homeButton"
).addEventListener(
  "click",
  ()=>{
    location.reload();
  }
);

</script>
