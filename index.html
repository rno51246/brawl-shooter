<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>STAR BRAWL ARENA</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

:root{
  --yellow:#ffd900;
  --blue:#24c8ff;
  --pink:#ff3b81;
  --purple:#7545d8;
  --dark:#11131b;
  --green:#37e56b;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 20%,#29334f 0%,#10131c 55%,#07080c 100%);
  color:white;
  font-family:Arial,"Noto Sans JP",sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
}

#app{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  width:min(1100px,96vw);
  height:min(760px,96vh);
  background:#171a25;
  border:5px solid #ff3b81;
  border-radius:24px;
  box-shadow:
    0 0 30px #ff3b8155,
    inset 0 0 30px #0008;
  overflow:hidden;
  position:relative;
}

/* =========================
   COMMON
========================= */

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:flex;
}

/* =========================
   HOME
========================= */

#home{
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  padding:18px;
}

.logo{
  font-size:42px;
  font-weight:1000;
  color:var(--yellow);
  text-shadow:
    4px 4px 0 #ff3b81,
    7px 7px 0 #000;
  letter-spacing:2px;
  margin:5px 0 12px;
}

.subtitle{
  color:#9eeeff;
  font-weight:bold;
  margin-bottom:12px;
}

.section-title{
  width:min(800px,94%);
  color:#25d7ff;
  font-size:14px;
  font-weight:bold;
  margin:8px 0 5px;
}

.mode-grid{
  width:min(800px,94%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.mode{
  padding:12px 5px;
  border-radius:13px;
  border:2px solid #4b5060;
  background:#292d3a;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:.15s;
}

.mode:hover{
  transform:translateY(-2px);
}

.mode.selected{
  background:#24c8ff;
  color:#061018;
  border-color:white;
  box-shadow:0 0 14px #24c8ff;
}

.character-grid{
  width:min(800px,94%);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.character{
  min-height:160px;
  background:linear-gradient(#30364a,#1b1e29);
  border:3px solid #505666;
  border-radius:18px;
  padding:8px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.15s;
}

.character:hover{
  transform:translateY(-3px);
}

.character.selected{
  border-color:var(--yellow);
  box-shadow:0 0 18px #ffd90088;
}

.character .portrait{
  height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.char-svg{
  width:75px;
  height:75px;
}

.char-name{
  font-size:18px;
  font-weight:1000;
}

.char-desc{
  font-size:10px;
  color:#c9ceda;
  margin-top:4px;
}

.stat{
  margin-top:6px;
  text-align:left;
  font-size:9px;
}

.statbar{
  height:6px;
  background:#111;
  border-radius:5px;
  margin-top:2px;
  overflow:hidden;
}

.statfill{
  height:100%;
  background:var(--yellow);
}

.start{
  margin-top:15px;
  padding:15px 60px;
  border:0;
  border-radius:40px;
  background:linear-gradient(#4dff79,#18a94d);
  box-shadow:0 5px 0 #087631;
  color:#071108;
  font-size:22px;
  font-weight:1000;
  cursor:pointer;
}

.start:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #087631;
}

/* =========================
   BATTLE
========================= */

#battle{
  flex-direction:column;
  background:#090b10;
}

.hud{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px;
  background:linear-gradient(#202533,#11131b);
  border-bottom:3px solid #353a49;
}

.hud-left{
  display:flex;
  gap:10px;
  align-items:center;
}

.score-box,
.timer-box{
  padding:6px 11px;
  border-radius:10px;
  background:#090b10;
  border:2px solid #363b49;
  font-weight:bold;
}

.score-number{
  color:var(--yellow);
}

.timer-number{
  color:#ff477e;
}

.combo{
  color:#24c8ff;
  font-weight:1000;
}

.battle-area{
  flex:1;
  display:flex;
  gap:8px;
  padding:7px;
  min-height:0;
}

#field{
  flex:1;
  position:relative;
  overflow:hidden;
  border-radius:15px;
  border:4px solid #6c49cf;
  background:
    linear-gradient(#3e8a3b,#28662e);
}

/* map decorations */

.tile{
  position:absolute;
  pointer-events:none;
}

.wall{
  background:
    linear-gradient(135deg,#756b5c,#50483d);
  border:3px solid #302b27;
  box-shadow:inset 0 0 0 2px #948978;
  border-radius:6px;
}

.grass{
  background:
    radial-gradient(circle,#4aaf4a 0 15%,transparent 16%),
    radial-gradient(circle,#2d8d3b 0 18%,transparent 19%);
  background-size:15px 15px;
  opacity:.95;
}

.water{
  background:
    repeating-linear-gradient(
      0deg,
      #278fc2 0px,
      #278fc2 8px,
      #37aee0 9px,
      #278fc2 15px
    );
  border:3px solid #196e99;
}

/* units */

.unit{
  position:absolute;
  width:48px;
  height:58px;
  z-index:20;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.unit-shadow{
  position:absolute;
  width:42px;
  height:12px;
  background:#0008;
  border-radius:50%;
  bottom:-2px;
  left:3px;
}

.body{
  position:absolute;
  left:7px;
  top:15px;
  width:34px;
  height:36px;
  border-radius:13px 13px 11px 11px;
  border:3px solid #171717;
}

.head{
  position:absolute;
  left:8px;
  top:0;
  width:32px;
  height:31px;
  border-radius:50%;
  background:#f2bd83;
  border:3px solid #171717;
  z-index:2;
}

.eye{
  position:absolute;
  width:5px;
  height:7px;
  background:#171717;
  border-radius:50%;
  top:10px;
}

.eye.a{left:8px}
.eye.b{right:8px}

.hair{
  position:absolute;
  left:4px;
  top:-3px;
  width:38px;
  height:15px;
  border-radius:50% 50% 30% 30%;
  background:#27202b;
  z-index:3;
}

.weapon{
  position:absolute;
  width:25px;
  height:7px;
  background:#bfc4cc;
  border:2px solid #222;
  right:-17px;
  top:29px;
  transform:rotate(-15deg);
  z-index:4;
}

/* characters */

.himiko .body{
  background:#b845d5;
}

.himiko .hair{
  background:#f4f4f4;
}

.nobunaga .body{
  background:#315ed9;
}

.nobunaga .hair{
  background:#161616;
}

.ryoma .body{
  background:#c47b2c;
}

.ryoma .hair{
  background:#6d391d;
}

/* enemies */

.enemy .body{
  background:#d72e4d;
}

.enemy .head{
  background:#d6d6d6;
}

.enemy .hair{
  background:#272727;
}

.enemy .weapon{
  background:#ffda33;
}

/* bullets */

.projectile{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  z-index:30;
  pointer-events:none;
}

.bullet-himiko{
  background:#d67cff;
  box-shadow:0 0 12px #e69cff;
}

.bullet-nobunaga{
  width:18px;
  height:6px;
  border-radius:3px;
  background:#58c7ff;
  box-shadow:0 0 12px #58c7ff;
}

.bullet-ryoma{
  width:16px;
  height:16px;
  background:#ff9e3d;
  box-shadow:0 0 14px #ff9e3d;
}

/* side panel */

.side{
  width:155px;
  background:#171a23;
  border:2px solid #303544;
  border-radius:12px;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.player-card{
  background:#222634;
  padding:6px;
  border-radius:9px;
}

.player-name{
  font-size:11px;
  font-weight:bold;
}

.hp{
  height:11px;
  background:#111;
  border:1px solid #000;
  border-radius:5px;
  overflow:hidden;
  margin-top:4px;
}

.hp-fill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#26d969,#8aff40);
  transition:.15s;
}

.power{
  padding:7px;
  border-radius:8px;
  background:#2a2e3c;
  font-size:11px;
  text-align:center;
}

.power strong{
  color:#ffd900;
}

.ult{
  margin-top:auto;
  min-height:78px;
  border-radius:50%;
  border:4px solid #414141;
  background:#303238;
  color:#777;
  font-weight:1000;
  cursor:not-allowed;
}

.ult.ready{
  background:radial-gradient(circle,#fff36a,#ffbf00);
  color:#171000;
  border-color:white;
  box-shadow:0 0 22px #ffd900;
  cursor:pointer;
  animation:pulse 1s infinite;
}

.ult.active{
  background:#ff477e;
  color:white;
  border-color:white;
}

@keyframes pulse{
  50%{transform:scale(1.07)}
}

/* controls */

.controls{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:80;
}

.joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ffffff18;
  border:3px solid #ffffff35;
  pointer-events:auto;
  touch-action:none;
}

.stick{
  position:absolute;
  width:48px;
  height:48px;
  left:25px;
  top:25px;
  border-radius:50%;
  background:#ffffff45;
  border:2px solid #ffffff70;
}

.attack-btn{
  position:absolute;
  right:28px;
  bottom:30px;
  width:76px;
  height:76px;
  border-radius:50%;
  border:4px solid white;
  background:#e53d57;
  color:white;
  font-weight:1000;
  pointer-events:auto;
  box-shadow:0 4px 0 #8c1f32;
}

.attack-btn:active{
  transform:scale(.92);
}

/* effects */

.damage{
  position:absolute;
  z-index:100;
  font-weight:1000;
  font-size:20px;
  color:white;
  text-shadow:2px 2px #000;
  animation:damage 650ms forwards;
  pointer-events:none;
}

@keyframes damage{
  from{transform:translate(-50%,0) scale(1)}
  to{transform:translate(-50%,-45px) scale(1.3);opacity:0}
}

.ko{
  position:absolute;
  z-index:110;
  font-size:30px;
  font-weight:1000;
  color:#ffd900;
  text-shadow:4px 4px #ff276e,6px 6px #000;
  animation:ko 850ms forwards;
  pointer-events:none;
}

@keyframes ko{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}
  30%{transform:translate(-50%,-50%) scale(1.5) rotate(5deg);opacity:1}
  100%{transform:translate(-50%,-90%) scale(1);opacity:0}
}

.super-ring{
  position:absolute;
  width:180px;
  height:180px;
  border:12px solid #ffd900;
  border-radius:50%;
  z-index:90;
  pointer-events:none;
  animation:ring .5s ease-out forwards;
}

@keyframes ring{
  from{
    transform:translate(-50%,-50%) scale(.1);
    opacity:1;
  }
  to{
    transform:translate(-50%,-50%) scale(2);
    opacity:0;
  }
}

/* =========================
 RESULT
========================= */

#result{
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#343d66,#10131c 70%);
}

.result-title{
  font-size:46px;
  color:#ffd900;
  text-shadow:5px 5px #ff397c,8px 8px #000;
}

.final-score{
  font-size:55px;
  font-weight:1000;
}

.result-comment{
  color:#70e5ff;
  font-weight:bold;
  margin:10px;
}

.retry{
  padding:13px 50px;
  border:0;
  border-radius:30px;
  background:#7647dd;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
 countdown
========================= */

#countdown{
  position:absolute;
  inset:0;
  z-index:200;
  display:none;
  justify-content:center;
  align-items:center;
  background:#0007;
}

.count-text{
  font-size:100px;
  font-weight:1000;
  color:#ffd900;
  text-shadow:
    8px 8px #ff397c,
    12px 12px #000;
  animation:count .75s ease-out;
}

@keyframes count{
  from{transform:scale(2);opacity:0}
  60%{transform:scale(1);opacity:1}
  to{transform:scale(.8);opacity:0}
}

/* mobile */

@media(max-width:700px){
  .game{
    width:100vw;
    height:100vh;
    border-radius:0;
    border-width:3px;
  }

  .logo{
    font-size:29px;
  }

  .mode-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .character-grid{
    gap:6px;
  }

  .character{
    min-height:135px;
  }

  .char-desc{
    display:none;
  }

  .side{
    width:105px;
  }

  .joystick{
    width:90px;
    height:90px;
  }

  .stick{
    left:20px;
    top:20px;
  }
}
</style>
</head>

<body>

<div id="app">
<div class="game">

<!-- ================= HOME ================= -->

<section id="home" class="screen active">

  <div class="logo">STAR BRAWL ARENA</div>
  <div class="subtitle">チームを組んで、アリーナを制覇しよう！</div>

  <div class="section-title">▼ バトルモード</div>

  <div class="mode-grid">
    <button class="mode selected" data-mode="solo">⚔️ ソロ</button>
    <button class="mode" data-mode="duo">👥 デュオ</button>
    <button class="mode" data-mode="trio">👥👥 トリオ</button>
    <button class="mode" data-mode="rush">💥 ラッシュ</button>
  </div>

  <div class="section-title">▼ キャラクター</div>

  <div class="character-grid">

    <div class="character selected" data-char="himiko">
      <div class="portrait">
        <div class="unit himiko" style="position:relative;transform:none">
          <div class="unit-shadow"></div>
          <div class="hair"></div>
          <div class="head"><i class="eye a"></i><i class="eye b"></i></div>
          <div class="body"></div>
          <div class="weapon"></div>
        </div>
      </div>

      <div class="char-name">HIMIKO</div>
      <div class="char-desc">魔法弾を操る遠距離型</div>

      <div class="stat">
        攻撃
        <div class="statbar"><div class="statfill" style="width:80%"></div></div>
      </div>
      <div class="stat">
        HP
        <div class="statbar"><div class="statfill" style="width:70%"></div></div>
      </div>
    </div>


    <div class="character" data-char="nobunaga">
      <div class="portrait">
        <div class="unit nobunaga" style="position:relative;transform:none">
          <div class="unit-shadow"></div>
          <div class="hair"></div>
          <div class="head"><i class="eye a"></i><i class="eye b"></i></div>
          <div class="body"></div>
          <div class="weapon"></div>
        </div>
      </div>

      <div class="char-name">NOBUNAGA</div>
      <div class="char-desc">高速連射が得意な戦士</div>

      <div class="stat">
        攻撃
        <div class="statbar"><div class="statfill" style="width:90%"></div></div>
      </div>
      <div class="stat">
        HP
        <div class="statbar"><div class="statfill" style="width:85%"></div></div>
      </div>
    </div>


    <div class="character" data-char="ryoma">
      <div class="portrait">
        <div class="unit ryoma" style="position:relative;transform:none">
          <div class="unit-shadow"></div>
          <div class="hair"></div>
          <div class="head"><i class="eye a"></i><i class="eye b"></i></div>
          <div class="body"></div>
          <div class="weapon"></div>
        </div>
      </div>

      <div class="char-name">RYOMA</div>
      <div class="char-desc">強力な一撃を放つパワー型</div>

      <div class="stat">
        攻撃
        <div class="statbar"><div class="statfill" style="width:100%"></div></div>
      </div>
      <div class="stat">
        HP
        <div class="statbar"><div class="statfill" style="width:95%"></div></div>
      </div>
    </div>

  </div>

  <button class="start" id="startButton">
    BATTLE START!
  </button>

</section>


<!-- ================= BATTLE ================= -->

<section id="battle" class="screen">

  <div class="hud">

    <div class="hud-left">
      <div class="score-box">
        SCORE:
        <span class="score-number" id="score">0</span>
      </div>

      <div class="combo" id="combo">
        COMBO ×0
      </div>
    </div>

    <div class="timer-box">
      TIME:
      <span class="timer-number" id="timer">60</span>
    </div>

  </div>


  <div class="battle-area">

    <div id="field"></div>

    <div class="side">

      <div class="player-card">
        <div class="player-name" id="playerName">
          HIMIKO
        </div>

        <div class="hp">
          <div class="hp-fill" id="playerHp"></div>
        </div>
      </div>

      <div class="player-card" id="ally1Card" style="display:none">
        <div class="player-name">ALLY 1</div>
        <div class="hp">
          <div class="hp-fill" id="ally1Hp"></div>
        </div>
      </div>

      <div class="player-card" id="ally2Card" style="display:none">
        <div class="player-name">ALLY 2</div>
        <div class="hp">
          <div class="hp-fill" id="ally2Hp"></div>
        </div>
      </div>

      <div class="power">
        ⚡ SUPER
        <strong id="superPercent">0%</strong>
      </div>

      <div class="power">
        🎁 POWER
        <strong id="powerLevel">0</strong>
      </div>

      <button class="ult" id="ultButton">
        SUPER
      </button>

    </div>

  </div>


  <div class="controls">

    <div class="joystick" id="joystick">
      <div class="stick" id="stick"></div>
    </div>

    <button class="attack-btn" id="attackButton">
      ATTACK
    </button>

  </div>


  <div id="countdown">
    <div class="count-text" id="countText">
      3
    </div>
  </div>

</section>


<!-- ================= RESULT ================= -->

<section id="result" class="screen">

  <div class="result-title">
    BATTLE OVER
  </div>

  <div class="final-score">
    <span id="finalScore">0</span>
  </div>

  <div class="result-comment" id="resultComment">
    GREAT BATTLE!
  </div>

  <button class="retry" id="retry">
    HOME
  </button>

</section>

</div>
</div>


<script>

/* =========================================================
   GAME DATA
========================================================= */

const characters = {

  himiko:{
    name:"HIMIKO",
    className:"himiko",
    maxHp:1000,
    speed:3.0,
    damage:150,
    superDamage:420
  },

  nobunaga:{
    name:"NOBUNAGA",
    className:"nobunaga",
    maxHp:1200,
    speed:3.2,
    damage:100,
    superDamage:350
  },

  ryoma:{
    name:"RYOMA",
    className:"ryoma",
    maxHp:1450,
    speed:2.7,
    damage:230,
    superDamage:600
  }

};


/* =========================================================
   STATE
========================================================= */

let selectedCharacter="himiko";
let selectedMode="solo";

let score=0;
let timeLeft=60;
let combo=0;

let superCharge=0;
let powerLevel=0;

let gameRunning=false;
let superMode=false;

let timerInterval=null;
let gameLoop=null;
let enemyTimer=null;
let itemTimer=null;

let keys={};

let player={
  x:150,
  y:200,
  hp:1000,
  maxHp:1000,
  speed:3,
  damage:100
};

let enemies=[];
let projectiles=[];
let items=[];
let walls=[];

let enemyId=0;


/* =========================================================
   DOM
========================================================= */

const home=document.getElementById("home");
const battle=document.getElementById("battle");
const result=document.getElementById("result");

const field=document.getElementById("field");

const scoreEl=document.getElementById("score");
const timerEl=document.getElementById("timer");
const comboEl=document.getElementById("combo");

const playerHp=document.getElementById("playerHp");
const playerName=document.getElementById("playerName");

const superPercent=document.getElementById("superPercent");
const powerLevelEl=document.getElementById("powerLevel");

const ultButton=document.getElementById("ultButton");

const attackButton=document.getElementById("attackButton");


/* =========================================================
   MENU
========================================================= */

document.querySelectorAll(".mode").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".mode")
      .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");

    selectedMode=button.dataset.mode;

  });

});


document.querySelectorAll(".character").forEach(card=>{

  card.addEventListener("click",()=>{

    document.querySelectorAll(".character")
      .forEach(c=>c.classList.remove("selected"));

    card.classList.add("selected");

    selectedCharacter=card.dataset.char;

  });

});


/* =========================================================
   START
========================================================= */

document.getElementById("startButton").addEventListener("click",startGame);

function startGame(){

  home.classList.remove("active");
  battle.classList.add("active");

  const c=characters[selectedCharacter];

  player={
    x:120,
    y:220,
    hp:c.maxHp,
    maxHp:c.maxHp,
    speed:c.speed,
    damage:c.damage
  };

  score=0;
  combo=0;
  timeLeft=60;
  superCharge=0;
  powerLevel=0;

  enemies=[];
  projectiles=[];
  items=[];
  walls=[];

  field.innerHTML="";

  playerName.textContent=c.name;

  createMap();
  createPlayer();

  if(selectedMode==="duo" || selectedMode==="trio"){
    document.getElementById("ally1Card").style.display="block";
  }else{
    document.getElementById("ally1Card").style.display="none";
  }

  if(selectedMode==="trio"){
    document.getElementById("ally2Card").style.display="block";
  }else{
    document.getElementById("ally2Card").style.display="none";
  }

  updateUI();

  gameRunning=false;

  startCountdown();

}


/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(){

  const box=document.getElementById("countdown");
  const text=document.getElementById("countText");

  box.style.display="flex";

  let count=3;

  function next(){

    text.textContent=count;

    text.style.animation="none";
    void text.offsetWidth;
    text.style.animation="count .75s ease-out";

    if(count===0){

      text.textContent="BRAWL!";

      text.style.animation="none";
      void text.offsetWidth;
      text.style.animation="count .9s ease-out";

      setTimeout(()=>{

        box.style.display="none";
        beginBattle();

      },700);

      return;
    }

    count--;

    setTimeout(next,750);

  }

  next();

}


/* =========================================================
   BEGIN
========================================================= */

function beginBattle(){

  gameRunning=true;

  spawnEnemy();

  timerInterval=setInterval(()=>{

    if(!gameRunning)return;

    timeLeft--;

    timerEl.textContent=timeLeft;

    if(timeLeft<=0){
      endGame();
    }

  },1000);


  enemyTimer=setInterval(()=>{

    if(gameRunning){
      spawnEnemy();
    }

  },1600);


  itemTimer=setInterval(()=>{

    if(gameRunning){
      spawnItem();
    }

  },5000);


  gameLoop=requestAnimationFrame(loop);

}


/* =========================================================
   MAP
========================================================= */

function createMap(){

  const w=field.clientWidth;
  const h=field.clientHeight;

  /* water */

  createDecoration(
    "water",
    0,
    h-85,
    w,
    65
  );

  /* grass areas */

  createDecoration(
    "grass",
    30,
    60,
    130,
    90
  );

  createDecoration(
    "grass",
    w-180,
    60,
    140,
    100
  );

  createDecoration(
    "grass",
    w/2-70,
    h-170,
    140,
    80
  );

  /* walls */

  const mapWalls=[
    [210,70,130,35],
    [210,105,35,130],
    [w-340,70,130,35],
    [w-245,105,35,130],

    [w/2-90,h/2-20,180,40],

    [180,h-220,130,35],
    [w-310,h-220,130,35]
  ];

  mapWalls.forEach(a=>{
    createWall(...a);
  });

}


function createDecoration(type,x,y,w,h){

  const el=document.createElement("div");

  el.className="tile "+type;

  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.width=w+"px";
  el.style.height=h+"px";

  field.appendChild(el);

}


function createWall(x,y,w,h){

  const el=document.createElement("div");

  el.className="tile wall";

  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.width=w+"px";
  el.style.height=h+"px";

  field.appendChild(el);

  walls.push({x,y,w,h});

}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

  const c=characters[selectedCharacter];

  const unit=document.createElement("div");

  unit.id="playerUnit";

  unit.className="unit "+c.className;

  unit.innerHTML=`
    <div class="unit-shadow"></div>
    <div class="hair"></div>
    <div class="head">
      <i class="eye a"></i>
      <i class="eye b"></i>
    </div>
    <div class="body"></div>
    <div class="weapon"></div>
  `;

  field.appendChild(unit);

  updatePlayerPosition();

}


function updatePlayerPosition(){

  const unit=document.getElementById("playerUnit");

  if(!unit)return;

  unit.style.left=player.x+"px";
  unit.style.top=player.y+"px";

}


/* =========================================================
   MOVEMENT
========================================================= */

document.addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

});


document.addEventListener("keyup",e=>{

  keys[e.key.toLowerCase()]=false;

});


function movePlayer(){

  if(!gameRunning)return;

  let dx=0;
  let dy=0;

  if(keys["arrowleft"] || keys["a"])dx--;
  if(keys["arrowright"] || keys["d"])dx++;
  if(keys["arrowup"] || keys["w"])dy--;
  if(keys["arrowdown"] || keys["s"])dy++;

  /* joystick */

  dx+=joystickX;
  dy+=joystickY;

  const len=Math.hypot(dx,dy);

  if(len>0){

    dx/=len;
    dy/=len;

    const speed=player.speed;

    let nx=player.x+dx*speed;
    let ny=player.y+dy*speed;

    nx=Math.max(25,Math.min(field.clientWidth-25,nx));
    ny=Math.max(30,Math.min(field.clientHeight-35,ny));

    if(!collidesWithWall(nx,ny)){

      player.x=nx;
      player.y=ny;

    }

  }

  updatePlayerPosition();

}


function collidesWithWall(x,y){

  const r=22;

  return walls.some(w=>{

    return(
      x+r>w.x &&
      x-r<w.x+w.w &&
      y+r>w.y &&
      y-r<w.y+w.h
    );

  });

}


/* =========================================================
   JOYSTICK
========================================================= */

let joystickX=0;
let joystickY=0;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(clientX,clientY){

  const rect=joystick.getBoundingClientRect();

  let x=clientX-(rect.left+rect.width/2);
  let y=clientY-(rect.top+rect.height/2);

  const max=32;

  const distance=Math.hypot(x,y);

  if(distance>max){

    x=x/distance*max;
    y=y/distance*max;

  }

  joystickX=x/max;
  joystickY=y/max;

  stick.style.transform=`translate(${x}px,${y}px)`;

}


function joystickEnd(){

  joystickX=0;
  joystickY=0;

  stick.style.transform="translate(0,0)";

}


joystick.addEventListener("pointermove",e=>{
  joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerdown",e=>{
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",joystickEnd);
joystick.addEventListener("pointercancel",joystickEnd);


/* =========================================================
   ATTACK
========================================================= */

field.addEventListener("pointerdown",e=>{

  if(!gameRunning)return;

  if(superMode){

    useSuperAt(
      e.clientX-field.getBoundingClientRect().left,
      e.clientY-field.getBoundingClientRect().top
    );

    return;

  }

  shootAt(
    e.clientX-field.getBoundingClientRect().left,
    e.clientY-field.getBoundingClientRect().top
  );

});


attackButton.addEventListener("pointerdown",e=>{

  e.preventDefault();

  if(!gameRunning)return;

  /* attack nearest enemy */

  if(enemies.length===0)return;

  let nearest=enemies[0];

  let best=Infinity;

  enemies.forEach(enemy=>{

    const d=Math.hypot(
      enemy.x-player.x,
      enemy.y-player.y
    );

    if(d<best){

      best=d;
      nearest=enemy;

    }

  });

  shootAt(nearest.x,nearest.y);

});


function shootAt(targetX,targetY){

  const c=characters[selectedCharacter];

  let dx=targetX-player.x;
  let dy=targetY-player.y;

  const len=Math.hypot(dx,dy);

  if(len===0)return;

  dx/=len;
  dy/=len;

  const projectile=document.createElement("div");

  projectile.className=
    "projectile bullet-"+c.className;

  projectile.style.left=player.x+"px";
  projectile.style.top=player.y+"px";

  field.appendChild(projectile);

  projectiles.push({

    el:projectile,

    x:player.x,
    y:player.y,

    dx,
    dy,

    speed:selectedCharacter==="ryoma"?7:9,

    damage:player.damage*(1+powerLevel*.12),

    enemy:false

  });

}


/* =========================================================
   SUPER
========================================================= */

ultButton.addEventListener("click",e=>{

  e.stopPropagation();

  if(superCharge<100)return;

  if(!superMode){

    superMode=true;

    ultButton.classList.add("active");
    ultButton.textContent="SELECT";

  }

});


function useSuperAt(x,y){

  if(!superMode)return;

  superMode=false;
  superCharge=0;

  ultButton.classList.remove("active");

  const c=characters[selectedCharacter];

  const ring=document.createElement("div");

  ring.className="super-ring";

  ring.style.left=x+"px";
  ring.style.top=y+"px";

  field.appendChild(ring);

  setTimeout(()=>ring.remove(),550);


  enemies.forEach(enemy=>{

    const d=Math.hypot(
      enemy.x-x,
      enemy.y-y
    );

    if(d<130){

      damageEnemy(
        enemy,
        c.superDamage*(1+powerLevel*.1)
      );

    }

  });

  updateUI();

}


/* =========================================================
   ENEMIES
========================================================= */

function spawnEnemy(){

  if(!gameRunning)return;

  const w=field.clientWidth;
  const h=field.clientHeight;

  let x;
  let y;

  for(let i=0;i<20;i++){

    x=40+Math.random()*(w-80);
    y=40+Math.random()*(h-130);

    if(Math.hypot(x-player.x,y-player.y)>180){
      break;
    }

  }

  const el=document.createElement("div");

  el.className="unit enemy";

  el.innerHTML=`
    <div class="unit-shadow"></div>
    <div class="hair"></div>
    <div class="head">
      <i class="eye a"></i>
      <i class="eye b"></i>
    </div>
    <div class="body"></div>
    <div class="weapon"></div>
  `;

  field.appendChild(el);

  const enemy={

    id:++enemyId,

    el,

    x,
    y,

    hp:500+powerLevel*70,
    maxHp:500+powerLevel*70,

    speed:.8+Math.random()*.45,

    attackCooldown:0

  };

  enemies.push(enemy);

}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

  enemies.forEach(enemy=>{

    let dx=player.x-enemy.x;
    let dy=player.y-enemy.y;

    const distance=Math.hypot(dx,dy);

    if(distance>55){

      dx/=distance;
      dy/=distance;

      const nx=enemy.x+dx*enemy.speed;
      const ny=enemy.y+dy*enemy.speed;

      if(!collidesWithWall(nx,ny)){

        enemy.x=nx;
        enemy.y=ny;

      }

    }

    enemy.el.style.left=enemy.x+"px";
    enemy.el.style.top=enemy.y+"px";

    if(enemy.attackCooldown>0){

      enemy.attackCooldown--;

    }else if(distance<250){

      enemyAttack(enemy);

      enemy.attackCooldown=100;

    }

  });

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(enemy){

  const projectile=document.createElement("div");

  projectile.className="projectile";

  projectile.style.background="#ff477e";
  projectile.style.boxShadow="0 0 12px #ff477e";

  projectile.style.left=enemy.x+"px";
  projectile.style.top=enemy.y+"px";

  field.appendChild(projectile);

  const dx=player.x-enemy.x;
  const dy=player.y-enemy.y;
  const len=Math.hypot(dx,dy);

  projectiles.push({

    el:projectile,

    x:enemy.x,
    y:enemy.y,

    dx:dx/len,
    dy:dy/len,

    speed:5,

    damage:55,

    enemy:true

  });

}


/* =========================================================
   PROJECTILES
========================================================= */

function updateProjectiles(){

  projectiles.forEach((p,index)=>{

    p.x+=p.dx*p.speed;
    p.y+=p.dy*p.speed;

    p.el.style.left=p.x+"px";
    p.el.style.top=p.y+"px";


    /* enemy bullet */

    if(p.enemy){

      if(Math.hypot(
        p.x-player.x,
        p.y-player.y
      )<25){

        player.hp-=p.damage;

        p.el.remove();
        projectiles.splice(index,1);

        showDamage(
          player.x,
          player.y,
          p.damage
        );

        updateUI();

        if(player.hp<=0){

          player.hp=player.maxHp*.5;

          showMessage(
            "REVIVE!"
          );

        }

      }

    }else{

      let hit=false;

      enemies.forEach(enemy=>{

        if(hit)return;

        if(Math.hypot(
          p.x-enemy.x,
          p.y-enemy.y
        )<30){

          damageEnemy(enemy,p.damage);

          hit=true;

        }

      });

      if(hit || p.x<0 || p.y<0 ||
        p.x>field.clientWidth ||
        p.y>field.clientHeight){

        p.el.remove();
        projectiles.splice(index,1);

      }

    }

  });

}


/* =========================================================
   DAMAGE
========================================================= */

function damageEnemy(enemy,damage){

  if(!enemies.includes(enemy))return;

  enemy.hp-=damage;

  showDamage(
    enemy.x,
    enemy.y,
    Math.round(damage)
  );

  superCharge=Math.min(
    100,
    superCharge+Math.max(5,damage/30)
  );

  if(enemy.hp<=0){

    koEnemy(enemy);

  }

  updateUI();

}


function koEnemy(enemy){

  const index=enemies.indexOf(enemy);

  if(index===-1)return;

  enemies.splice(index,1);

  enemy.el.remove();

  score+=100;

  combo++;

  superCharge=Math.min(
    100,
    superCharge+15
  );

  showKO(
    enemy.x,
    enemy.y
  );

  /* chance to drop power */

  if(Math.random()<.45){

    spawnPowerItem(
      enemy.x,
      enemy.y
    );

  }

}


/* =========================================================
   ITEMS
========================================================= */

function spawnItem(){

  if(!gameRunning)return;

  const x=50+Math.random()*(field.clientWidth-100);
  const y=50+Math.random()*(field.clientHeight-160);

  spawnPowerItem(x,y);

}


function spawnPowerItem(x,y){

  const el=document.createElement("div");

  el.style.position="absolute";
  el.style.left=x+"px";
  el.style.top=y+"px";
  el.style.width="30px";
  el.style.height="30px";
  el.style.transform="translate(-50%,-50%)";
  el.style.borderRadius="8px";
  el.style.background="#69e34d";
  el.style.border="3px solid white";
  el.style.boxShadow="0 0 15px #69e34d";
  el.style.zIndex="15";
  el.style.display="flex";
  el.style.alignItems="center";
  el.style.justifyContent="center";
  el.textContent="⚡";

  field.appendChild(el);

  items.push({
    el,
    x,
    y
  });

}


function updateItems(){

  items.forEach((item,index)=>{

    if(Math.hypot(
      item.x-player.x,
      item.y-player.y
    )<35){

      powerLevel++;

      player.hp=Math.min(
        player.maxHp,
        player.hp+180
      );

      item.el.remove();

      items.splice(index,1);

      showMessage(
        "POWER UP!"
      );

      updateUI();

    }

  });

}


/* =========================================================
   EFFECTS
========================================================= */

function showDamage(x,y,value){

  const el=document.createElement("div");

  el.className="damage";

  el.textContent="-"+Math.round(value);

  el.style.left=x+"px";
  el.style.top=y+"px";

  field.appendChild(el);

  setTimeout(()=>el.remove(),650);

}


function showKO(x,y){

  const el=document.createElement("div");

  el.className="ko";

  el.textContent="K.O.!";

  el.style.left=x+"px";
  el.style.top=y+"px";

  field.appendChild(el);

  setTimeout(()=>el.remove(),850);

}


function showMessage(text){

  const el=document.createElement("div");

  el.className="ko";

  el.textContent=text;

  el.style.left="50%";
  el.style.top="40%";

  field.appendChild(el);

  setTimeout(()=>el.remove(),850);

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

  scoreEl.textContent=score;

  comboEl.textContent=
    "COMBO ×"+combo;

  playerHp.style.width=
    Math.max(
      0,
      player.hp/player.maxHp*100
    )+"%";

  superPercent.textContent=
    Math.round(superCharge)+"%";

  powerLevelEl.textContent=
    powerLevel;

  if(superCharge>=100){

    ultButton.classList.add("ready");
    ultButton.textContent=
      superMode?"SELECT AREA":"SUPER READY";

  }else{

    ultButton.classList.remove("ready");
    ultButton.textContent="SUPER";

  }

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  if(!gameRunning)return;

  movePlayer();
  updateEnemies();
  updateProjectiles();
  updateItems();

  updateUI();

  gameLoop=requestAnimationFrame(loop);

}


/* =========================================================
   END
========================================================= */

function endGame(){

  if(!gameRunning)return;

  gameRunning=false;

  clearInterval(timerInterval);
  clearInterval(enemyTimer);
  clearInterval(itemTimer);

  cancelAnimationFrame(gameLoop);

  document.getElementById("finalScore")
    .textContent=score;

  let comment="";

  if(score>=1500){
    comment="🏆 LEGENDARY BATTLE!";
  }else if(score>=800){
    comment="🔥 GREAT BATTLE!";
  }else if(score>=300){
    comment="👍 NICE FIGHT!";
  }else{
    comment="💪 KEEP TRAINING!";
  }

  document.getElementById("resultComment")
    .textContent=comment;

  battle.classList.remove("active");
  result.classList.add("active");

}


document.getElementById("retry").addEventListener(
  "click",
  ()=>{
    location.reload();
  }
);


/* =========================================================
   KEYBOARD ATTACK
========================================================= */

document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();

    if(gameRunning){

      attackButton.click();

    }

  }

});


</script>
