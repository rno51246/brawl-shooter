<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BRAWL ARENA 3.0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#10131b;
  user-select:none;
}

button{
  font-family:inherit;
}

/* =========================
   共通
========================= */

.screen{
  width:100vw;
  height:100vh;
}

.hidden{
  display:none!important;
}


/* =========================
   HOME
========================= */

#home{
  position:relative;
  overflow:auto;
  padding:25px 15px 35px;

  display:flex;
  flex-direction:column;
  align-items:center;

  background:
    radial-gradient(circle at 50% 5%,#495879 0%,#24293a 38%,#0e1119 100%);

  color:white;
}

#home::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.13;

  background-image:
    linear-gradient(45deg,#fff 1px,transparent 1px),
    linear-gradient(-45deg,#fff 1px,transparent 1px);

  background-size:35px 35px;
}

.logo{
  position:relative;
  z-index:2;

  margin:0;

  font-size:clamp(42px,8vw,76px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-4px;

  color:#ffe600;

  text-shadow:
    5px 5px 0 #121212,
    9px 9px 0 #ed1765,
    12px 12px 0 #080808;
}

.logo-sub{
  position:relative;
  z-index:2;

  margin:2px 0 18px;

  color:#7cecff;
  font-size:12px;
  font-weight:1000;
  letter-spacing:4px;
}

.panel{
  position:relative;
  z-index:2;

  width:min(850px,94vw);

  margin:7px 0;
  padding:14px;

  border-radius:18px;

  background:rgba(16,18,27,.9);
  border:2px solid rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.08);
}

.section-title{
  margin-bottom:9px;

  color:#ffe600;

  font-size:13px;
  font-weight:1000;
  letter-spacing:1px;
}

.modes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.mode{
  padding:13px 5px;

  border-radius:12px;
  border:2px solid #505568;

  background:#272c3d;
  color:#fff;

  font-weight:1000;
  cursor:pointer;

  transition:.15s;
}

.mode:hover{
  transform:translateY(-2px);
}

.mode.selected{
  color:#071015;
  background:#00d9f3;
  border-color:#fff;

  box-shadow:
    0 0 15px #00e5ff;
}

.mode small{
  display:block;
  margin-top:3px;
  opacity:.7;
  font-size:9px;
}


/* =========================
   CHARACTER SELECT
========================= */

.characters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.character{
  position:relative;

  min-height:230px;

  padding:10px;

  border-radius:18px;
  border:3px solid #4e5365;

  background:
    linear-gradient(180deg,#464d67,#252938);

  color:#fff;

  cursor:pointer;

  overflow:hidden;

  transition:.15s;
}

.character:hover{
  transform:translateY(-3px);
}

.character.selected{
  border-color:#ffe600;

  box-shadow:
    0 0 22px rgba(255,230,0,.55);

  background:
    linear-gradient(180deg,#555d79,#2c3043);
}

.character.selected::after{
  content:"SELECTED";

  position:absolute;
  top:7px;
  right:7px;

  padding:4px 7px;

  border-radius:8px;

  background:#ffe600;
  color:#111;

  font-size:8px;
  font-weight:1000;
}

.char-canvas{
  width:100%;
  height:120px;

  display:block;
}

.char-name{
  font-size:20px;
  font-weight:1000;
}

.char-role{
  margin-top:2px;

  color:#74e9ff;

  font-size:10px;
  font-weight:900;
}

.stat-row{
  display:flex;
  align-items:center;

  gap:5px;

  margin-top:5px;

  font-size:9px;
  font-weight:900;
}

.stat-label{
  width:34px;
  text-align:left;
}

.stat-bar{
  flex:1;
  height:5px;

  border-radius:5px;
  background:#17191f;

  overflow:hidden;
}

.stat-fill{
  height:100%;
  background:#ffe600;
}

.attack-info{
  margin-top:6px;

  font-size:9px;
  line-height:1.4;

  color:#d9dcea;
}


/* =========================
   START
========================= */

.start-button{
  position:relative;
  z-index:2;

  margin-top:15px;

  padding:16px 65px;

  border:0;
  border-radius:40px;

  background:linear-gradient(#61ff72,#13a83e);

  color:#071108;

  font-size:23px;
  font-weight:1000;

  box-shadow:
    0 6px 0 #086126,
    0 0 25px rgba(50,255,90,.25);

  cursor:pointer;
}

.start-button:active{
  transform:translateY(5px);
  box-shadow:0 1px #086126;
}


/* =========================
   GAME
========================= */

#game{
  position:relative;
  overflow:hidden;

  background:#335c34;
}

#canvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;
}


/* =========================
   HUD
========================= */

#hud{
  position:absolute;

  top:10px;
  left:10px;
  right:10px;

  display:flex;
  justify-content:space-between;

  z-index:20;

  pointer-events:none;
}

.hud-box{
  min-width:85px;

  padding:7px 11px;

  border-radius:10px;

  background:rgba(0,0,0,.72);
  border:2px solid rgba(255,255,255,.15);

  color:white;

  font-weight:1000;
  font-size:13px;

  text-align:center;
}

#hpHud{
  color:#5cff72;
}

#scoreHud{
  color:#59e9ff;
}

#timeHud{
  color:#ffe600;
}


/* =========================
   AMMO / ULT
========================= */

#bottomHud{
  position:absolute;

  left:50%;
  bottom:15px;

  transform:translateX(-50%);

  z-index:21;

  display:flex;
  flex-direction:column;
  align-items:center;

  pointer-events:none;
}

#ammo{
  color:white;

  font-size:15px;
  font-weight:1000;

  text-shadow:2px 2px #111;
}

#reloadBar{
  width:100px;
  height:7px;

  margin-top:3px;

  border-radius:7px;

  background:#222;

  overflow:hidden;
}

#reloadFill{
  height:100%;
  width:100%;

  background:#00e5ff;
}

#ultStatus{
  margin-top:5px;

  padding:4px 9px;

  border-radius:9px;

  background:rgba(0,0,0,.65);

  color:#aaa;

  font-size:10px;
  font-weight:1000;
}

#ultStatus.ready{
  background:#ffe600;
  color:#111;

  box-shadow:0 0 14px #ffe600;
}


/* =========================
   ANNOUNCEMENT
========================= */

#announcement{
  position:absolute;

  left:50%;
  top:45%;

  transform:translate(-50%,-50%) scale(.2);

  z-index:50;

  opacity:0;

  color:#ffe600;

  font-size:clamp(50px,11vw,100px);

  font-weight:1000;
  font-style:italic;

  text-shadow:
    5px 5px #111,
    9px 9px #ed1765;

  pointer-events:none;

  white-space:nowrap;
}

#announcement.show{
  animation:brawlAnnouncement .9s ease-out;
}

@keyframes brawlAnnouncement{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2) rotate(-8deg);
  }

  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.25) rotate(3deg);
  }

  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) rotate(0);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.15);
  }
}


/* =========================
   COMBO
========================= */

#combo{
  position:absolute;

  left:50%;
  top:105px;

  transform:translateX(-50%);

  z-index:21;

  opacity:0;

  color:white;

  font-size:24px;
  font-weight:1000;

  text-shadow:
    3px 3px #111;

  pointer-events:none;
}

#combo.active{
  opacity:1;
  animation:comboPop .25s;
}

@keyframes comboPop{

  from{
    transform:translateX(-50%) scale(.5);
  }

  to{
    transform:translateX(-50%) scale(1);
  }

}


/* =========================
   MOBILE CONTROLS
========================= */

#controls{
  position:absolute;
  inset:0;

  z-index:40;

  pointer-events:none;
}

#joystick{
  position:absolute;

  left:22px;
  bottom:25px;

  width:135px;
  height:135px;

  border-radius:50%;

  background:rgba(255,255,255,.08);

  border:3px solid rgba(255,255,255,.22);

  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;

  left:39px;
  top:39px;

  width:54px;
  height:54px;

  border-radius:50%;

  background:rgba(255,255,255,.38);

  border:2px solid rgba(255,255,255,.5);

  box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.control-button{
  position:absolute;

  border-radius:50%;

  border:4px solid white;

  color:white;

  font-weight:1000;

  pointer-events:auto;

  touch-action:none;
}

#attackButton{
  right:25px;
  bottom:28px;

  width:92px;
  height:92px;

  background:
    radial-gradient(circle at 35% 25%,#ff7998,#d31c50);

  box-shadow:0 0 20px rgba(255,20,90,.5);

  font-size:13px;
}

#attackButton:active{
  transform:scale(.9);
}

#ultButton{
  right:130px;
  bottom:45px;

  width:72px;
  height:72px;

  border-color:#555;

  background:#36383d;

  color:#777;

  font-size:12px;
}

#ultButton.ready{
  border-color:white;

  background:
    radial-gradient(circle,#fff82d,#ff9800);

  color:#111;

  box-shadow:0 0 22px #ffe600;

  animation:ultPulse .65s infinite alternate;
}

@keyframes ultPulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.08);
  }

}


/* =========================
   RESULT
========================= */

#result{
  display:none;

  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 50% 25%,#49536f,#11141d);

  color:white;
  text-align:center;
}

.result-title{
  color:#ffe600;

  font-size:clamp(45px,9vw,80px);

  font-weight:1000;
  font-style:italic;

  text-shadow:
    5px 5px #ed1765,
    8px 8px #111;
}

.result-score{
  margin:12px;

  font-size:42px;
  font-weight:1000;
}

.result-stats{
  line-height:2;

  color:#8deeff;

  font-weight:1000;
}

.home-button{
  margin-top:25px;

  padding:13px 45px;

  border:0;
  border-radius:30px;

  background:#8a2be2;
  color:white;

  font-size:18px;
  font-weight:1000;

  cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  #home{
    padding-top:18px;
  }

  .logo{
    font-size:43px;
  }

  .panel{
    padding:10px;
  }

  .modes{
    grid-template-columns:repeat(2,1fr);
  }

  .characters{
    gap:6px;
  }

  .character{
    min-height:205px;
    padding:6px;
  }

  .char-canvas{
    height:105px;
  }

  .char-name{
    font-size:16px;
  }

  .attack-info{
    display:none;
  }

  .start-button{
    margin-bottom:15px;
  }

}
</style>
</head>


<body>


<!-- =====================================================
 HOME
===================================================== -->

<div id="home" class="screen">

  <h1 class="logo">BRAWL ARENA</h1>
  <div class="logo-sub">MOVE • AIM • POWER • BRAWL</div>


  <!-- MODE -->

  <div class="panel">

    <div class="section-title">
      ⚔️ BATTLE MODE
    </div>

    <div class="modes">

      <button class="mode selected" data-mode="solo">
        SOLO
        <small>敵を倒せ！</small>
      </button>

      <button class="mode" data-mode="duo">
        DUO
        <small>仲間と戦え！</small>
      </button>

      <button class="mode" data-mode="trio">
        TRIO
        <small>3人チーム</small>
      </button>

      <button class="mode" data-mode="gem">
        GEM HUNT
        <small>宝石を集めろ！</small>
      </button>

    </div>

  </div>


  <!-- CHARACTERS -->

  <div class="panel">

    <div class="section-title">
      ⭐ CHOOSE YOUR BRAWLER
    </div>

    <div class="characters">


      <!-- HIMIKO -->

      <div class="character selected" data-char="0">

        <canvas
          class="char-canvas"
          id="charPreview0">
        </canvas>

        <div class="char-name">
          HIMIKO
        </div>

        <div class="char-role">
          🔮 AREA CONTROL
        </div>

        <div class="stat-row">
          <span class="stat-label">HP</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:70%"></div>
          </div>
        </div>

        <div class="stat-row">
          <span class="stat-label">ATK</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:65%"></div>
          </div>
        </div>

        <div class="attack-info">
          魔法弾を発射。<br>
          ULT：巨大魔法陣。
        </div>

      </div>


      <!-- NOBUNAGA -->

      <div class="character" data-char="1">

        <canvas
          class="char-canvas"
          id="charPreview1">
        </canvas>

        <div class="char-name">
          NOBUNAGA
        </div>

        <div class="char-role">
          ⚔️ HEAVY ATTACKER
        </div>

        <div class="stat-row">
          <span class="stat-label">HP</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:95%"></div>
          </div>
        </div>

        <div class="stat-row">
          <span class="stat-label">ATK</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:95%"></div>
          </div>
        </div>

        <div class="attack-info">
          強力な近距離斬撃。<br>
          ULT：天下斬。
        </div>

      </div>


      <!-- RYOMA -->

      <div class="character" data-char="2">

        <canvas
          class="char-canvas"
          id="charPreview2">
        </canvas>

        <div class="char-name">
          RYOMA
        </div>

        <div class="char-role">
          🔫 FAST SHOOTER
        </div>

        <div class="stat-row">
          <span class="stat-label">HP</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:60%"></div>
          </div>
        </div>

        <div class="stat-row">
          <span class="stat-label">ATK</span>
          <div class="stat-bar">
            <div class="stat-fill" style="width:75%"></div>
          </div>
        </div>

        <div class="attack-info">
          3方向射撃。<br>
          ULT：全方向連射。
        </div>

      </div>

    </div>

  </div>


  <button id="startButton" class="start-button">
    BATTLE START!
  </button>

</div>



<!-- =====================================================
 GAME
===================================================== -->

<div id="game" class="screen hidden">

  <canvas id="canvas"></canvas>


  <div id="hud">

    <div class="hud-box">
      ❤️ <span id="hpHud">600</span>
    </div>

    <div class="hud-box">
      ⭐ <span id="scoreHud">0</span>
    </div>

    <div class="hud-box">
      ⏱ <span id="timeHud">60</span>
    </div>

  </div>


  <div id="bottomHud">

    <div id="ammo">
      ● ● ●
    </div>

    <div id="reloadBar">
      <div id="reloadFill"></div>
    </div>

    <div id="ultStatus">
      ULT 0%
    </div>

  </div>


  <div id="announcement"></div>

  <div id="combo"></div>


  <div id="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button
      id="ultButton"
      class="control-button">
      ULT
    </button>

    <button
      id="attackButton"
      class="control-button">
      ATTACK
    </button>

  </div>

</div>



<!-- =====================================================
 RESULT
===================================================== -->

<div id="result" class="screen">

  <div class="result-title">
    BATTLE OVER
  </div>

  <div class="result-score">
    ⭐ <span id="finalScore">0</span>
  </div>

  <div class="result-stats">
    KNOCKOUT：<span id="finalKills">0</span><br>
    POWER：<span id="finalPower">0</span><br>
    MAX COMBO：<span id="finalCombo">0</span>
  </div>

  <button id="homeButton" class="home-button">
    HOME
  </button>

</div>



<script>

/* ==========================================================
   BRAWL ARENA 3.0
========================================================== */


/* ==========================================================
   CANVAS
========================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=900;
let H=650;

function resize(){

  const rect=canvas.getBoundingClientRect();

  W=rect.width;
  H=rect.height;

  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  createMap();

}

window.addEventListener("resize",resize);


/* ==========================================================
   CHARACTERS
========================================================== */

const CHARACTERS=[

  {
    name:"HIMIKO",

    hp:600,
    speed:2.45,

    damage:55,

    ammo:3,

    reload:650,

    bulletSpeed:7,

    range:470,

    radius:23,

    color:"#a55cff",

    type:"magic"

  },

  {
    name:"NOBUNAGA",

    hp:800,
    speed:1.95,

    damage:95,

    ammo:2,

    reload:850,

    bulletSpeed:6,

    range:200,

    radius:25,

    color:"#ffb32b",

    type:"sword"

  },

  {
    name:"RYOMA",

    hp:520,
    speed:3.0,

    damage:38,

    ammo:3,

    reload:600,

    bulletSpeed:9,

    range:520,

    radius:22,

    color:"#39c7ff",

    type:"gun"

  }

];


let selectedChar=0;
let gameMode="solo";


/* ==========================================================
   GAME VARIABLES
========================================================== */

let player=null;

let enemies=[];
let allies=[];

let bullets=[];
let particles=[];
let damageTexts=[];
let floatingItems=[];

let walls=[];
let bushes=[];

let gems=[];

let score=0;
let kills=0;
let combo=0;
let maxCombo=0;

let powerLevel=0;

let timeLeft=60;

let running=false;
let countdown=false;

let lastTime=0;
let lastShot=0;

let ammo=3;
let reloadTimer=0;

let ultCharge=0;

let attacking=false;

let mouseX=W/2;
let mouseY=H/2;

let keys={};

let cameraShake=0;


/* ==========================================================
   MENU
========================================================== */

document.querySelectorAll(".mode")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".mode")
      .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");

    gameMode=button.dataset.mode;

  });

});


document.querySelectorAll(".character")
.forEach(card=>{

  card.addEventListener("click",()=>{

    document.querySelectorAll(".character")
      .forEach(c=>c.classList.remove("selected"));

    card.classList.add("selected");

    selectedChar=Number(card.dataset.char);

  });

});


/* ==========================================================
   CHARACTER PREVIEWS
========================================================== */

function drawPreview(canvas,index){

  const c=canvas.getContext("2d");

  const w=canvas.width=240;
  const h=canvas.height=130;

  c.clearRect(0,0,w,h);

  c.save();

  c.translate(w/2,h/2+15);

  c.scale(1.2,1.2);

  drawCharacter(c,index,0,0,1,false);

  c.restore();

}


function drawAllPreviews(){

  drawPreview(
    document.getElementById("charPreview0"),
    0
  );

  drawPreview(
    document.getElementById("charPreview1"),
    1
  );

  drawPreview(
    document.getElementById("charPreview2"),
    2
  );

}


/* ==========================================================
   START
========================================================== */

document.getElementById("startButton")
.addEventListener("click",startGame);


function startGame(){

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("result")
    .style.display="none";

  document.getElementById("game")
    .classList.remove("hidden");

  resize();


  score=0;
  kills=0;
  combo=0;
  maxCombo=0;

  powerLevel=0;

  timeLeft=60;

  ultCharge=0;

  enemies=[];
  allies=[];
  bullets=[];
  particles=[];
  damageTexts=[];
  floatingItems=[];
  gems=[];


  const c=CHARACTERS[selectedChar];


  player={

    x:W/2,
    y:H-120,

    radius:c.radius,

    hp:c.hp,
    maxHp:c.hp,

    speed:c.speed,

    damage:c.damage,

    ammoMax:c.ammo,

    reload:c.reload,

    bulletSpeed:c.bulletSpeed,

    range:c.range,

    type:c.type,

    color:c.color,

    alive:true,

    invisible:false,

    invincible:0

  };


  ammo=c.ammo;

  createMap();


  /* ENEMIES */

  const enemyCount=
    gameMode==="solo"
    ? 6
    : gameMode==="gem"
    ? 7
    : 5;


  for(let i=0;i<enemyCount;i++){
    spawnEnemy();
  }


  /* ALLIES */

  ){

      )
    );

  if(gameMode==="trio"){

    allies.push(
      createAlly(

      )
    );

    (now-lastTime)/16.67,

  update(dt);

========================================================== */

  updateBullets(dt);

/* ==========================================================
   PLAYER
========================================================== */

function updatePlayer(dt){

  let dx=0;
  let dy=0;


  if(keys["w"]||keys["arrowup"]){
    dy-=1;
  }

  if(keys["s"]||keys["arrowdown"]){
    dy+=1;
  }

  if(keys["a"]||keys["arrowleft"]){
    dx-=1;
  }

  if(keys["d"]||keys["arrowright"]){
    dx+=1;
  }


  dx+=joyX;
  dy+=joyY;


  const length=Math.hypot(dx,dy);


  if(length>0){

    dx/=length;
    dy/=length;

    moveEntity(
      player,
      dx*player.speed*dt,
      dy*player.speed*dt
    );

  }


  player.invisible=isInBush(player);


  if(player.invincible>0){
    player.invincible-=dt;
  }

}

/* ==========================================================
   JOYSTICK
========================================================== */

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joyX=0;
let joyY=0;


function updateJoystick(x,y){

  const r=joystick.getBoundingClientRect();

  let dx=
    x-(r.left+r.width/2);

  let dy=
    y-(r.top+r.height/2);

  const max=42;

  const d=Math.hypot(dx,dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.left=(40+dx)+"px";
  stick.style.top=(40+dy)+"px";

}


function resetJoystick(){

  joyX=0;
  joyY=0;

  stick.style.left="40px";
  stick.style.top="40px";

}


joystick.addEventListener("pointerdown",e=>{

  joystick.setPointerCapture(e.pointerId);

  updateJoystick(
    e.clientX,
    e.clientY
  );

});


joystick.addEventListener("pointermove",e=>{

  updateJoystick(
    e.clientX,
    e.clientY
  );

});


joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

/* ==========================================================
   AUTO AIM
========================================================== */

function autoAimShoot(){

  if(!player)return;

  let nearest=null;
  let best=Infinity;


  for(const enemy of enemies){

    if(enemy.hp<=0)continue;

    if(
      player.invisible &&
      !isSameBush(player,enemy)
    )continue;


    const d=distance(
      player,
      enemy
    );


    if(d<best){

      best=d;
      nearest=enemy;

    }

  }


  if(nearest){

    shoot(
      nearest.x,
      nearest.y
    );

  }

}


/* ==========================================================
   SHOOT
========================================================== */

function shoot(tx,ty){

  if(!running)return;

  if(!player.alive)return;

  if(ammo<=0)return;


  const now=performance.now();


  if(
    now-lastShot<
    player.reload*.72
  ){

    return;

  }


  lastShot=now;

  ammo--;

  const angle=Math.atan2(
    ty-player.y,
    tx-player.x
  );


  /* HIMIKO */

  if(player.type==="magic"){

    bullets.push({

      x:player.x,
      y:player.y,

      vx:Math.cos(angle)*player.bulletSpeed,
      vy:Math.sin(angle)*player.bulletSpeed,

      radius:9,

      damage:player.damage,

      owner:"player",

      life:player.range/player.bulletSpeed,

      kind:"magic"

    });

    addMagicShot(
      player.x,
      player.y,
      angle
    );

  }


  /* NOBUNAGA */

  else if(player.type==="sword"){

    bullets.push({

      x:player.x,
      y:player.y,

      vx:Math.cos(angle)*player.bulletSpeed,
      vy:Math.sin(angle)*player.bulletSpeed,

      radius:18,

      damage:player.damage,

      owner:"player",

      life:22,

      kind:"slash"

    });

    addSlash(
      player.x,
      player.y,
      angle,
      65
    );

  }


  /* RYOMA */

  else{

    for(let i=-1;i<=1;i++){

      const a=
        angle+i*.15;

      bullets.push({

        x:player.x,
        y:player.y,

        vx:Math.cos(a)*player.bulletSpeed,
        vy:Math.sin(a)*player.bulletSpeed,

        radius:6,

        damage:player.damage,

        owner:"player",

        life:player.range/player.bulletSpeed,

        kind:"bullet"

      });

    }

    addMuzzleFlash(
      player.x,
      player.y,
      angle
    );

  }

}

========================================================== */

function enemyShoot(enemy){

  const dx=player.x-enemy.x;
  const dy=player.y-enemy.y;

  const d=Math.hypot(dx,dy);

  if(d===0)return;


  bullets.push({

    x:enemy.x,
    y:enemy.y,

    vx:dx/d*4.1,
    vy:dy/d*4.1,

    radius:7,

    damage:18,

    owner:"enemy",

    life:100,

    kind:"enemy"

  });

}


/* ==========================================================
   BULLETS
========================================================== */

function updateBullets(dt){

  for(const b of bullets){

    b.x+=b.vx*dt;
    b.y+=b.vy*dt;

    b.life-=dt;


    for(const wall of walls){

      if(
        b.x>wall.x &&
        b.x<wall.x+wall.w &&
        b.y>wall.y &&
        b.y<wall.y+wall.h
      ){

        b.life=0;

        addParticles(
          b.x,
          b.y,
          5
        );

      }

    }


    /* PLAYER ATTACK */

    if(b.owner==="player"){

      for(const enemy of enemies){

        if(enemy.hp<=0)continue;


        if(
          distance(b,enemy)<
          b.radius+enemy.radius
        ){

          b.life=0;


          enemy.hp-=b.damage;


          score+=5;

          combo++;

          maxCombo=Math.max(
            maxCombo,
            combo
          );


          ultCharge=Math.min(
            100,
            ultCharge+7
          );


          addDamageText(
            enemy.x,
            enemy.y,
            b.damage
          );


          addParticles(
            enemy.x,
            enemy.y,
            8
          );


          if(combo>=2){
            showCombo();
          }


          if(enemy.hp<=0){

            enemy.hp=0;

            kills++;

            score+=100;

            combo++;

            maxCombo=Math.max(
              maxCombo,
              combo
            );


            ultCharge=Math.min(
              100,
              ultCharge+18
            );


            knockout(
              enemy.x,
              enemy.y
            );


            /* POWER-UP DROP */

            if(Math.random()<.35){

              floatingItems.push({

                x:enemy.x,
                y:enemy.y,

                type:
                  Math.random()<.55
                  ?"power"
                  :"heal",

                life:600

              });

            }


            setTimeout(()=>{

              if(running){

                spawnEnemy();

              }

            },900);

          }

          break;

        }

      }

    }


    /* ENEMY ATTACK */

    if(b.owner==="enemy"){

      if(
        distance(b,player)<
        b.radius+player.radius
      ){

        b.life=0;


        if(player.invincible<=0){

          player.hp-=b.damage;

          combo=0;

          addDamageText(
            player.x,
            player.y,
            b.damage
          );

          addParticles(
            player.x,
            player.y,
            8
          );


          if(player.hp<=0){

            player.hp=0;

            knockout(
              player.x,
              player.y
            );

            endGame();

          }

        }

      }

    }

  }


  bullets=bullets.filter(
    b=>
      b.life>0 &&
      b.x>-50 &&
      b.x<W+50 &&
      b.y>-50 &&
      b.y<H+50
  );

}


/* ==========================================================
   ENEMIES AI
========================================================== */

function updateEnemies(dt){

  for(const enemy of enemies){

    if(enemy.hp<=0)continue;


    const hidden=
      player.invisible &&
      !isSameBush(
        player,
        enemy
      );


    const dx=player.x-enemy.x;
    const dy=player.y-enemy.y;

    const d=Math.hypot(dx,dy);


    if(hidden){

      enemy.wanderTimer+=dt;

      moveEntity(
        enemy,
        Math.cos(enemy.direction)*
        enemy.speed*.8*dt,

        Math.sin(enemy.direction)*
        enemy.speed*.8*dt
      );


      if(enemy.wanderTimer>80){

        enemy.direction=
          Math.random()*Math.PI*2;

        enemy.wanderTimer=0;

      }

      continue;

    }


    if(d>190){

      moveEntity(
        enemy,
        dx/d*
        enemy.speed*
        dt,

        dy/d*
        enemy.speed*
        dt
      );

    }
    else{

      const strafe=
        Math.sin(
          performance.now()/500+
          enemy.x
        );


      moveEntity(
        enemy,
        -dy/d*
        enemy.speed*
        strafe*
        dt,

        dx/d*
        enemy.speed*
        strafe*
        dt
      );

    }


    enemy.shootTimer-=dt*16.67;


    if(
      enemy.shootTimer<=0 &&
      d<430 &&
      !isLineBlocked(
        enemy,
        player
      )
    ){

      enemyShoot(enemy);

      enemy.shootTimer=
        850+Math.random()*700;

    }

  }

}


/* ==========================================================
   ALLIES AI
========================================================== */

function updateAllies(dt){

  for(const ally of allies){

    if(ally.hp<=0)continue;


    let target=null;
    let best=Infinity;


    for(const enemy of enemies){

      if(enemy.hp<=0)continue;


      const d=
        distance(ally,enemy);


      if(d<best){

        best=d;
        target=enemy;

      }

    }


    if(!target)continue;


    const dx=target.x-ally.x;
    const dy=target.y-ally.y;

    const d=Math.hypot(dx,dy);


    if(d>180){

      moveEntity(
        ally,
        dx/d*ally.speed*dt,
        dy/d*ally.speed*dt
      );

    }


    ally.shootTimer-=dt*16.67;


    if(
      ally.shootTimer<=0 &&
      d<430 &&
      !isLineBlocked(
        ally,
        target
      )
    ){

      bullets.push({

        x:ally.x,
        y:ally.y,

        vx:dx/d*5,
        vy:dy/d*5,

        radius:6,

        damage:25,

        owner:"player",

        life:90,

        kind:"ally"

      });


      ally.shootTimer=700;

    }

  }

}

/* ==========================================================
   MOVE / COLLISION
========================================================== */

function moveEntity(entity,dx,dy){

  const ox=entity.x;
  const oy=entity.y;


  entity.x+=dx;

  entity.x=Math.max(
    entity.radius,
    Math.min(
      W-entity.radius,
      entity.x
    )
  );


  if(
    walls.some(
      w=>circleRect(entity,w)
    )
  ){

    entity.x=ox;

  }


  entity.y+=dy;

  entity.y=Math.max(
    entity.radius,
    Math.min(
      H-entity.radius,
      entity.y
    )
  );


  if(
    walls.some(
      w=>circleRect(entity,w)
    )
  ){

    entity.y=oy;

  }

}


function circleRect(c,r){

  const x=Math.max(
    r.x,
    Math.min(
      c.x,
      r.x+r.w
    )
  );

  const y=Math.max(
    r.y,
    Math.min(
      c.y,
      r.y+r.h
    )
  );


  return(
    (c.x-x)**2+
    (c.y-y)**2
  )<
  c.radius**2;

}


/* ==========================================================
   BUSH
========================================================== */

function isInBush(entity){

  return bushes.some(
    b=>
      entity.x>b.x &&
      entity.x<b.x+b.w &&
      entity.y>b.y &&
      entity.y<b.y+b.h
  );

}


function isSameBush(a,b){

  return bushes.some(
    bush=>{

      const aa=
        a.x>bush.x &&
        a.x<bush.x+bush.w &&
        a.y>bush.y &&
        a.y<bush.y+bush.h;

      const bb=
        b.x>bush.x &&
        b.x<bush.x+bush.w &&
        b.y>bush.y &&
        b.y<bush.y+bush.h;

      return aa&&bb;

    }
  );

}


/* ==========================================================
   LINE COLLISION
========================================================== */

function isLineBlocked(a,b){

  for(const r of walls){

    for(let i=0;i<=25;i++){

      const t=i/25;

      const x=
        a.x+(b.x-a.x)*t;

      const y=
        a.y+(b.y-a.y)*t;


      if(
        x>=r.x &&
        x<=r.x+r.w &&
        y>=r.y &&
        y<=r.y+r.h
      ){

        return true;

      }

    }

  }

  return false;

}


/* ==========================================================
   EFFECTS
========================================================== */

function addParticles(x,y,count){

  for(let i=0;i<count;i++){

    particles.push({

      type:"particle",

      x,
      y,

      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,

      size:2+Math.random()*5,

      life:20+Math.random()*30

    });

  }

}


function addMagicShot(x,y,a){

  particles.push({

    type:"magicShot",

    x,
    y,

    angle:a,

    life:12

  });

}


function addMuzzleFlash(x,y,a){

  particles.push({

    type:"muzzle",

    x,
    y,

    angle:a,

    life:10

  });

}


function addSlash(x,y,a,r){

  particles.push({

    type:"slash",

    x,
    y,

    angle:a,

    radius:r,

    life:18

  });

}


/* ==========================================================
   KO
========================================================== */

function knockout(x,y){

  cameraShake=12;


  particles.push({

    type:"ko",

    x,
    y,

    life:55,

    radius:15

  });


  addParticles(
    x,
    y,
    30
  );


  addDamageText(
    x,
    y-15,
    "KO!"
  );

}


/* ==========================================================
   PARTICLES UPDATE
========================================================== */

function updateParticles(dt){

  for(const p of particles){

    p.life-=dt;


    if(
      p.type==="particle"
    ){

      p.x+=p.vx*dt;
      p.y+=p.vy*dt;

      p.vx*=.96;
      p.vy*=.96;

    }

  }


  particles=
    particles.filter(
      p=>p.life>0
    );

}


/* ==========================================================
   DAMAGE TEXT
========================================================== */

function addDamageText(x,y,text){

  damageTexts.push({

    x,
    y,

    text,

    life:45,

    vy:-1

  });

}


function updateTexts(dt){

  for(const t of damageTexts){

    t.y+=t.vy*dt;

    t.life-=dt;

  }


  damageTexts=
    damageTexts.filter(
      t=>t.life>0
    );

}


function showCombo(){

  const el=
    document.getElementById("combo");


  el.textContent=
    "🔥 COMBO ×"+combo;


  el.classList.remove("active");

  void el.offsetWidth;

  el.classList.add("active");

}


/* ==========================================================
   ANNOUNCEMENT
========================================================== */

function showAnnouncement(text){

  const el=
    document.getElementById("announcement");


  el.textContent=text;

  el.classList.remove("show");

  void el.offsetWidth;

  el.classList.add("show");

}


/* ==========================================================
   DRAW
========================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.save();


  /* CAMERA SHAKE */

  if(cameraShake>0){

    ctx.translate(
      (Math.random()-.5)*cameraShake,
      (Math.random()-.5)*cameraShake
    );

  }


  /* GROUND */

  ctx.fillStyle="#4d8145";

  ctx.fillRect(
    -20,
    -20,
    W+40,
    H+40
  );


  /* TILE */

  ctx.globalAlpha=.09;

  ctx.strokeStyle="#fff";

  ctx.lineWidth=1;


  for(let x=0;x<W;x+=40){

    ctx.beginPath();

    ctx.moveTo(x,0);
    ctx.lineTo(x,H);

    ctx.stroke();

  }


  for(let y=0;y<H;y+=40){

    ctx.beginPath();

    ctx.moveTo(0,y);
    ctx.lineTo(W,y);

    ctx.stroke();

  }


  ctx.globalAlpha=1;


  /* MAP DECOR */

  drawMapDecor();


  /* WALLS */

  drawWalls();


  /* BUSHES */

  drawBushes();


  /* GEMS */

  drawGems();


  /* ITEMS */

  drawItems();


  /* BULLETS */

  drawBullets();


  /* ALLIES */

  for(const ally of allies){

    if(ally.hp>0){

      drawSimpleUnit(
        ally.x,
        ally.y,
        ally.radius,
        "#00e5ff",
        ally.emoji,
        ally.hp/ally.maxHp
      );

    }

  }


  /* ENEMIES */

  for(const enemy of enemies){

    if(enemy.hp<=0)continue;


    if(
      player.invisible &&
      !isSameBush(
        player,
        enemy
      )
    ){

      continue;

    }


    drawEnemy(enemy);

  }


  /* PLAYER */

  if(player&&player.alive){

    drawCharacter(
      ctx,
      selectedChar,
      player.x,
      player.y,
      1,
      true
    );


    /* PLAYER HP */

    drawHPBar(
      player.x,
      player.y-player.radius-16,
      58,
      player.hp/player.maxHp
    );

  }


  /* PARTICLES */

  drawParticles();


  /* DAMAGE */

  drawDamageTexts();


  ctx.restore();

}


/* ==========================================================
   MAP DECOR
========================================================== */

function drawMapDecor(){

  ctx.fillStyle="rgba(255,255,255,.05)";

  ctx.fillRect(
    W*.46,
    0,
    W*.08,
    H
  );


  /* center decoration */

  ctx.beginPath();

  ctx.arc(
    W/2,
    H/2,
    75,
    0,
    Math.PI*2
  );

  ctx.strokeStyle="rgba(255,255,255,.08)";
  ctx.lineWidth=4;

  ctx.stroke();

}


/* ==========================================================
   WALLS
========================================================== */

function drawWalls(){

  for(const w of walls){

    ctx.fillStyle="#795936";

    ctx.fillRect(
      w.x,
      w.y,
      w.w,
      w.h
    );


    ctx.fillStyle="#94704a";

    ctx.fillRect(
      w.x+3,
      w.y+3,
      w.w-6,
      7
    );


    ctx.strokeStyle="#35261b";

    ctx.lineWidth=3;

    ctx.strokeRect(
      w.x,
      w.y,
      w.w,
      w.h
    );


    for(
      let x=w.x+15;
      x<w.x+w.w;
      x+=35
    ){

      ctx.strokeStyle="rgba(50,30,15,.35)";

      ctx.beginPath();

      ctx.moveTo(
        x,
        w.y
      );

      ctx.lineTo(
        x,
        w.y+w.h
      );

      ctx.stroke();

    }

  }

}


/* ==========================================================
   BUSHES
========================================================== */

function drawBushes(){

  for(const b of bushes){

    ctx.fillStyle="#2c7133";

    ctx.fillRect(
      b.x,
      b.y,
      b.w,
      b.h
    );


    for(
      let x=b.x+6;
      x<b.x+b.w;
      x+=12
    ){

      for(
        let y=b.y+8;
        y<b.y+b.h;
        y+=14
      ){

        ctx.fillStyle=
          (x+y)%2===0
          ? "#4e9844"
          : "#377f38";


        ctx.beginPath();

        ctx.arc(
          x+(y%8),
          y,
          5,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

    }

  }

}


/* ==========================================================
   GEMS
========================================================== */

function drawGems(){

  for(const g of gems){

    const s=
      1+Math.sin(g.spin)*.15;


    ctx.save();

    ctx.translate(
      g.x,
      g.y
    );

    ctx.scale(
      s,
      s
    );


    ctx.rotate(
      g.spin
    );


    ctx.fillStyle="#b85cff";

    ctx.beginPath();

    ctx.moveTo(0,-10);
    ctx.lineTo(8,-3);
    ctx.lineTo(5,9);
    ctx.lineTo(-5,9);
    ctx.lineTo(-8,-3);

    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle="#fff";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.restore();

  }

}


/* ==========================================================
   ITEMS
========================================================== */

function drawItems(){

  for(const item of floatingItems){

    const bounce=
      Math.sin(
        performance.now()/160
      )*4;


    ctx.save();

    ctx.translate(
      item.x,
      item.y+bounce
    );


    if(item.type==="power"){

      ctx.fillStyle="#ff9d00";

      ctx.beginPath();

      ctx.moveTo(0,-15);
      ctx.lineTo(12,-4);
      ctx.lineTo(7,13);
      ctx.lineTo(-7,13);
      ctx.lineTo(-12,-4);

      ctx.closePath();

      ctx.fill();


      ctx.fillStyle="#fff";

      ctx.font="bold 12px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        "P",
        0,
        5
      );

    }
    else{

      ctx.fillStyle="#4cff68";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        13,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle="#fff";

      ctx.font="bold 13px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        "+",
        0,
        5
      );

    }


    ctx.restore();

  }

}


/* ==========================================================
   BULLETS DRAW
========================================================== */

function drawBullets(){

  for(const b of bullets){

    ctx.save();

    ctx.translate(
      b.x,
      b.y
    );


    const a=
      Math.atan2(
        b.vy,
        b.vx
      );

    ctx.rotate(a);


    if(b.kind==="magic"){

      ctx.fillStyle="#b95cff";

      ctx.shadowBlur=15;
      ctx.shadowColor="#d080ff";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else if(
      b.kind==="slash"
    ){

      ctx.fillStyle="#ffe600";

      ctx.fillRect(
        -15,
        -5,
        30,
        10
      );

    }


    else{

      ctx.fillStyle=
        b.owner==="enemy"
        ? "#ff3c70"
        : "#00e5ff";

      ctx.shadowBlur=10;
      ctx.shadowColor=ctx.fillStyle;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        b.radius,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    ctx.restore();

  }

}


/* ==========================================================
   PARTICLES DRAW
========================================================== */

function drawParticles(){

  for(const p of particles){

    const alpha=
      Math.max(
        0,
        p.life/50
      );


    ctx.globalAlpha=alpha;


    if(p.type==="particle"){

      ctx.fillStyle=
        Math.random()<.5
        ? "#ffe600"
        : "#fff";


      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else if(
      p.type==="magicShot"
    ){

      ctx.strokeStyle="#c46cff";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        14,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    else if(
      p.type==="muzzle"
    ){

      ctx.save();

      ctx.translate(
        p.x,
        p.y
      );

      ctx.rotate(
        p.angle
      );

      ctx.fillStyle="#ffe600";

      ctx.beginPath();

      ctx.moveTo(8,0);
      ctx.lineTo(28,-9);
      ctx.lineTo(20,0);
      ctx.lineTo(28,9);

      ctx.closePath();

      ctx.fill();

      ctx.restore();

    }


    else if(
      p.type==="slash"
    ){

      ctx.save();

      ctx.strokeStyle="#ffe600";

      ctx.lineWidth=13;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.radius,
        p.angle-.6,
        p.angle+.6
      );

      ctx.stroke();

      ctx.restore();

    }


    else if(
      p.type==="ultCircle"
    ){

      const progress=
        1-p.life/50;

      ctx.strokeStyle="#ffe600";

      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.radius*progress,
        0,
        Math.PI*2
      );

      ctx.stroke();


      ctx.fillStyle=
        "rgba(255,230,0,.15)";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.radius*progress,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    else if(
      p.type==="giantSlash"
    ){

      ctx.save();

      ctx.translate(
        p.x,
        p.y
      );

      ctx.rotate(
        p.angle
      );

      ctx.strokeStyle="#fff";

      ctx.lineWidth=28;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        280,
        -.55,
        .55
      );

      ctx.stroke();

      ctx.strokeStyle="#ffe600";

      ctx.lineWidth=15;

      ctx.stroke();

      ctx.restore();

    }


    else if(
      p.type==="rapid"
    ){

      ctx.strokeStyle="#00e5ff";

      ctx.lineWidth=5;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        60+(55-p.life)*3,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }


    else if(
      p.type==="ko"
    ){

      const progress=
        1-p.life/55;


      ctx.strokeStyle="#ff2c68";

      ctx.lineWidth=8;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        25+progress*55,
        0,
        Math.PI*2
      );

      ctx.stroke();


      ctx.font="bold 30px Arial";

      ctx.textAlign="center";

      ctx.fillStyle="#ffe600";

      ctx.fillText(
        "KO!",
        p.x,
        p.y-45-progress*20
      );

    }


    ctx.globalAlpha=1;

  }

}


/* ==========================================================
   DAMAGE TEXT DRAW
========================================================== */

function drawDamageTexts(){

  ctx.textAlign="center";

  for(const t of damageTexts){

    ctx.globalAlpha=
      Math.max(
        0,
        t.life/45
      );


    ctx.font=
      t.text==="KO!"
      ? "bold 25px Arial"
      : "bold 18px Arial";


    ctx.fillStyle=
      t.text==="KO!"
      ? "#ffe600"
      : "#fff";


    ctx.strokeStyle="#111";

    ctx.lineWidth=5;


    ctx.strokeText(
      t.text,
      t.x,
      t.y
    );


    ctx.fillText(
      t.text,
      t.x,
      t.y
    );

  }

  ctx.globalAlpha=1;

}


/* ==========================================================
   ENEMY DRAW
========================================================== */

function drawEnemy(enemy){

  drawSimpleUnit(
    enemy.x,
    enemy.y,
    enemy.radius,
    "#ff3d70",
    "👾",
    enemy.hp/enemy.maxHp
  );

}


/* ==========================================================
   SIMPLE UNIT
========================================================== */

function drawSimpleUnit(
  x,
  y,
  r,
  color,
  emoji,
  hp
){

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    r,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#171923";

  ctx.fill();


  ctx.strokeStyle=color;

  ctx.lineWidth=4;

  ctx.stroke();


  ctx.font=(r*1.2)+"px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillText(
    emoji,
    x,
    y
  );


  drawHPBar(
    x,
    y-r-13,
    48,
    hp
  );

}


/* ==========================================================
   HP BAR
========================================================== */

function drawHPBar(x,y,width,percent){

  percent=Math.max(
    0,
    Math.min(
      1,
      percent
    )
  );


  ctx.fillStyle="#202020";

  ctx.fillRect(
    x-width/2,
    y,
    width,
    6
  );


  ctx.fillStyle=
    percent>.35
    ? "#4bea58"
    : "#ff3c4e";


  ctx.fillRect(
    x-width/2,
    y,
    width*percent,
    6
  );

}

    );

      Math.PI,

    );

/* ==========================================================
   HUD
========================================================== */

function updateHUD(){

  document.getElementById("hpHud")
    .textContent=
      Math.ceil(player.hp);


  document.getElementById("scoreHud")
    .textContent=
      score;


  document.getElementById("timeHud")
    .textContent=
      Math.ceil(timeLeft);


  let ammoText="";


  for(
    let i=0;
    i<player.ammoMax;
    i++
  ){

    ammoText+=
      i<ammo
      ? "● "
      : "○ ";

  }


  document.getElementById("ammo")
    .textContent=
      ammoText;


  const reloadFill=
    document.getElementById("reloadFill");


  if(
    ammo>=player.ammoMax
  ){

    reloadFill.style.width="100%";

  }
  else{

    reloadFill.style.width=
      Math.min(
        100,
        reloadTimer/
        player.reload*
        100
      )+"%";

  }


  const ult=
    document.getElementById("ultButton");

  const status=
    document.getElementById("ultStatus");


  if(ultCharge>=100){

    ult.classList.add("ready");

    status.classList.add("ready");

    status.textContent=
      "⭐ ULT READY!";

  }
  else{

    ult.classList.remove("ready");

    status.classList.remove("ready");

    status.textContent=
      "ULT "+Math.floor(ultCharge)+"%";

  }

}


/* ==========================================================
   DISTANCE
========================================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* ==========================================================
   RESULT
========================================================== */

function endGame(){

  if(!running)return;

  running=false;
  countdown=false;

  if(player){
    player.alive=false;
  }


  document.getElementById("finalScore")
    .textContent=score;

  document.getElementById("finalKills")
    .textContent=kills;

  document.getElementById("finalPower")
    .textContent=powerLevel;

  document.getElementById("finalCombo")
    .textContent=maxCombo;


  document.getElementById("game")
    .classList.add("hidden");


  document.getElementById("result")
    .style.display="flex";

}


/* ==========================================================
   HOME BUTTON
========================================================== */

document.getElementById("homeButton")
.addEventListener("click",()=>{

  document.getElementById("result")
    .style.display="none";

  document.getElementById("home")
    .classList.remove("hidden");

});


/* ==========================================================
   INITIALIZE
========================================================== */

drawAllPreviews();

resize();

</script>
